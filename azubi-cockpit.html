<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azubi Cockpit — Mechatroniker/in</title>
<meta name="description" content="Digitales Ausbildungs-Cockpit fuer Mechatroniker/innen: Ausbildungsrahmenplan und Lernfelder, druckfertige Arbeitsblaetter, normgerechte technische Zeichnungen, Loesungshefte.">
<style>
/* ============================================================================
   Azubi Cockpit — Cockpit-UI (Design: Werkstatt / Blaupause, Theme-aware)
   ==========================================================================*/
:root{
  --ground:#EAEDE8; --panel:#FBFCFA; --panel-2:#F1F3EF;
  --ink:#15181B; --ink-2:#4A525B; --ink-3:#79828B;
  --line:#CDD3CE; --line-strong:#AEB6AF;
  --accent:#E4531D; --accent-ink:#fff; --blue:#0F6E78; --ok:#3F7D3A; --warn:#C8860B;
  --grid: color-mix(in srgb, var(--line) 55%, transparent);
  --font-body: system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --r:5px;
}
@media (prefers-color-scheme:dark){
  :root{--ground:#0E1113;--panel:#161A1D;--panel-2:#1C2124;--ink:#ECEFEB;--ink-2:#9AA4AC;--ink-3:#6C757D;
    --line:#2A3033;--line-strong:#3A4247;--accent:#FF6A38;--accent-ink:#160a04;--blue:#45B5C0;--ok:#67B95F;--warn:#E7AE3A;
    --grid:color-mix(in srgb,var(--line) 85%,transparent);}
}
:root[data-theme="light"]{--ground:#EAEDE8;--panel:#FBFCFA;--panel-2:#F1F3EF;--ink:#15181B;--ink-2:#4A525B;--ink-3:#79828B;
  --line:#CDD3CE;--line-strong:#AEB6AF;--accent:#E4531D;--accent-ink:#fff;--blue:#0F6E78;--ok:#3F7D3A;--warn:#C8860B;--grid:color-mix(in srgb,var(--line) 55%,transparent);}
:root[data-theme="dark"]{--ground:#0E1113;--panel:#161A1D;--panel-2:#1C2124;--ink:#ECEFEB;--ink-2:#9AA4AC;--ink-3:#6C757D;
  --line:#2A3033;--line-strong:#3A4247;--accent:#FF6A38;--accent-ink:#160a04;--blue:#45B5C0;--ok:#67B95F;--warn:#E7AE3A;--grid:color-mix(in srgb,var(--line) 85%,transparent);}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono)}

/* ---- Topbar ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:12px clamp(14px,4vw,32px);background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line-strong)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:18px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.brand small{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{font-family:var(--font-mono);font-size:12.5px;padding:6px 11px;border-radius:100px;border:1px solid transparent;color:var(--ink-2)}
.nav a:hover{border-color:var(--line-strong);color:var(--ink)}
.nav a.active{background:var(--accent);color:var(--accent-ink);font-weight:700}

.wrap{max-width:1060px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(14px,4vw,32px)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,6vw,52px);line-height:1;margin:.1em 0 .2em;text-wrap:balance}
h2{font-weight:800;letter-spacing:-.01em;font-size:clamp(22px,3.4vw,32px);margin:0 0 .3em}
p{color:var(--ink-2);max-width:70ch}
.lead{font-size:clamp(16px,2.1vw,19px);color:var(--ink);max-width:62ch}
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-bottom:14px}
.crumb a{color:var(--accent)}
section{margin-top:clamp(34px,5vw,60px)}

/* ---- Prinzip flow ---- */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:720px){.flow{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px}
.step .num{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700}
.step h3{margin:6px 0 4px;font-size:16px}
.step p{font-size:13.5px;margin:0}

/* ---- Duale Info ---- */
.duale{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:640px){.duale{grid-template-columns:1fr}}
.duale .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px 18px}
.duale .card h3{margin:0 0 4px;font-size:16px}
.duale .card small{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---- Lehrjahr cards ---- */
.lj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:820px){.lj-grid{grid-template-columns:1fr}}
.lj-card{display:block;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s}
.lj-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.lj-card .lj{font-family:var(--font-mono);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:3px;display:inline-block}
.lj-card h3{margin:12px 0 4px;font-size:19px}
.lj-card p{font-size:13.5px;margin:0 0 12px}
.progress{height:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:100px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}
.lj-card .pmeta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:6px;display:flex;justify-content:space-between}

/* ---- Modul list ---- */
.mod-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mod-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.mod-row:hover{border-color:var(--accent)}
.mod-row.locked{opacity:.7}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:700;white-space:nowrap}
.badge.fertig{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.badge.geruest{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-strong)}
.mod-row h3{margin:0 0 2px;font-size:16px}
.mod-row .sub{font-size:12.5px;color:var(--ink-3)}
.mod-row .weeks{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.mod-row .fach{font-family:var(--font-mono);font-size:10.5px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}

/* ---- Lernfelder box ---- */
.lf-box{background:var(--panel);border:1px solid var(--line-strong);border-left:3px solid var(--blue);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.lf-box h3{margin:0 0 8px;font-size:15px}
.lf-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.lf-item:last-child{border-bottom:0}
.lf-item .n{font-family:var(--font-mono);font-weight:700;color:var(--blue)}
.lf-item .h{font-family:var(--font-mono);color:var(--ink-3);font-size:12px}

/* ---- Modul-Detailleiste ---- */
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:4px 10px;border-radius:100px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--panel)}
.chip b{color:var(--ink)}

/* ---- Bausteine (Blätter) ---- */
.baustein-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(max-width:700px){.baustein-grid{grid-template-columns:1fr}}
.bs{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.bs:hover{border-color:var(--accent)}
.bs .t{flex:1}
.bs .t h3{margin:0;font-size:15px}
.bs .t small{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.typ{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:3px}
.typ.aufgabe{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent)}
.typ.theorie{background:color-mix(in srgb,var(--blue) 16%,var(--panel));color:var(--blue)}
.typ.zeichnung{background:color-mix(in srgb,var(--blue) 16%,var(--panel));color:var(--blue)}
.typ.praxis{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent)}
.typ.sicherheit{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.typ.loesung{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}

/* ---- Blatt (Detail) ---- */
.blatt-print{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:clamp(18px,3vw,32px);margin-top:16px}
.blatt-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.blatt-head .no{font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);background:var(--accent);padding:4px 10px;border-radius:3px;font-size:13px}
.blatt-head h2{margin:0;font-size:20px}
.blatt-head .app-tag{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.blatt-print h3{font-size:16px;margin:18px 0 6px}
.blatt-print p{color:var(--ink);font-size:14.5px}
.bl-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.bl-meta span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:100px;padding:2px 9px}
.bl-meta.ok span{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.ul,.ol{margin:6px 0;padding-left:22px}.ul li,.ol li{margin:4px 0;color:var(--ink);font-size:14.5px}
.frage{background:var(--panel-2);border:1px dashed var(--line-strong);border-radius:4px;padding:10px 12px;font-size:14px;color:var(--ink)!important}
.formel{font-family:var(--font-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 12px;display:inline-block;color:var(--ink)!important}
.tab{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.tab th,.tab td{border:1px solid var(--line-strong);padding:7px 10px;text-align:left}
.tab th{background:var(--panel-2);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.tab td{color:var(--ink)}
.chk{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14.5px;color:var(--ink)}
.box{width:16px;height:16px;border:1.6px solid var(--line-strong);border-radius:3px;flex:none;margin-top:2px}
.chk-hint{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)!important}
.unterschrift{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-strong);font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.zeichnung-halter{border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:#fdfdfb;margin:10px 0}
.zeichnung-halter .az-blatt{display:block;width:100%;height:auto}

/* Sicherheitszeichen */
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.sign-card{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.sign-card small{display:block;color:var(--ink-3);font-size:11.5px}
.sign{width:38px;height:38px;flex:none}
.sign-official{display:inline-flex}.sign-official svg{width:38px;height:38px;display:block}

/* Buttons */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:9px 16px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.footer{margin-top:60px;padding:22px 0;border-top:1px solid var(--line-strong);font-family:var(--font-mono);font-size:12px;color:var(--ink-3);text-align:center}
.note-mark{color:var(--accent);font-weight:700}

/* ---- Lernpfad ---- */
.pfad{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pfad-item{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:11px 14px;transition:border-color .15s}
.pfad-item:hover{border-color:var(--accent)}
.pfad-n{font-family:var(--font-mono);font-weight:700;font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-strong)}
.pfad-t{font-weight:600;font-size:14.5px}
.pfad-tg{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
@media(max-width:600px){.pfad-item{grid-template-columns:auto auto 1fr}.pfad-tg{display:none}}

/* ---- Filter ---- */
.filters{display:flex;flex-direction:column;gap:8px;margin:14px 0 16px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-family:var(--font-mono);font-size:12px;padding:5px 12px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-2);cursor:pointer}
.fchip:hover{border-color:var(--accent);color:var(--ink)}
.fchip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* ---- Katalog-Karten ---- */
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:700px){.kgrid{grid-template-columns:1fr}}
.kcard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:13px 15px;transition:border-color .15s}
.kcard:hover{border-color:var(--accent)}
.kcard .t{flex:1}.kcard .t h3{margin:0;font-size:15px}.kcard .t small{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}

/* ---- Aufgabe: Fertig/Ergänzen-Umschalter ---- */
.aufgabe .z-toggle{margin:6px 0 10px}
.btn.small{font-size:12px;padding:6px 12px}
.aufgabe .z-erg{display:none}
.aufgabe.erg .z-fertig{display:none}
.aufgabe.erg .z-erg{display:block}
.loesung-box{margin-top:16px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 14px}
.loesung-box summary{cursor:pointer;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ok);padding:8px 0}
.loesung-box p{font-size:14px}
.anknuepf{background:color-mix(in srgb,var(--blue) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));border-radius:var(--r);padding:9px 13px;font-size:13.5px;color:var(--ink);margin:6px 0 4px}
.anknuepf::before{content:"↪ ";color:var(--blue);font-weight:700}

/* Messschieber-Ablesung */
.msch-halter{overflow-x:auto;border:1px solid var(--line-strong);border-radius:4px;background:#fdfdfb;padding:8px 6px;margin:6px 0}
.msch{display:block;min-width:520px;width:100%;height:auto}

/* Aufgabe erstellen (Creator) */
.creator{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:18px}
@media(max-width:820px){.creator{grid-template-columns:1fr}}
.creator-form{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px}
.creator-form h3{margin:14px 0 6px;font-size:14px}
.creator-form h3:first-child{margin-top:0}
.frow{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.creator-form input,.creator-form select{font-family:var(--font-mono);font-size:12.5px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;background:var(--panel-2);color:var(--ink);width:64px}
.creator-form input[type=text]{width:120px}
.featrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin:6px 0;font-family:var(--font-mono);font-size:12px}
.featrow .ftag{font-weight:700;color:var(--blue)}
.featrow input{width:52px}
.rmfeat{cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);border-radius:4px;color:var(--accent);font-weight:700;padding:2px 7px}
.addbtns{display:flex;gap:8px;margin:8px 0}

/* Skizzen-Modus (Mini-CAD) */
.sk-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
.sk-tools,.sk-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sk-tool{font-family:var(--font-mono);font-size:12.5px;padding:6px 12px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-2);cursor:pointer}
.sk-tool:hover{border-color:var(--accent);color:var(--ink)}
.sk-tool.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.sk-chk{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.sk-wrap{margin-top:12px;padding:0;overflow:hidden}
#skcanvas{display:block;width:100%;height:auto;background:#fdfdfb;cursor:crosshair;touch-action:none}
.sk-vis{stroke:#1a1a1a;stroke-width:0.5;fill:none}
.sk-center{stroke:#1a1a1a;stroke-width:0.3;fill:none;stroke-dasharray:6 1.2 0.8 1.2}
.sk-dim{stroke:#1a1a1a;stroke-width:0.3;fill:none}
.sk-dimtx{fill:#1a1a1a;font-family:var(--font-mono);font-size:3px}
.sk-text{font-family:system-ui,sans-serif;font-size:4px;fill:#1a1a1a}
.sk-prev{stroke:var(--accent);stroke-width:0.6;fill:none;stroke-dasharray:2 1}

/* ============================================================================
   Druck: nur das aktuelle Blatt drucken (DIN A4), Rest ausblenden.
   Aktiviert über <body class="print-blatt"> beim Drucken eines Blatts.
   ==========================================================================*/
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff !important; }
  .topbar, .nav, .btnrow, .pager, .footer, .crumb { display: none !important; }

  /* Standard: Seite druckbar */
  body.print-blatt .wrap > *:not(.blatt-print) { display: none !important; }
  body.print-blatt .blatt-print {
    border: none !important; margin: 0 !important; padding: 0 !important;
    background: #fff !important; color: #000 !important;
  }
  .blatt-print, .blatt-print * { color: #000 !important; }
  .blatt-head { border-color: #000 !important; }
  .blatt-head .no { background: #000 !important; color: #fff !important; }
  .zeichnung-halter { border: none !important; page-break-inside: avoid; }
  .az-blatt { width: 100% !important; }
  .tab th { background: #eee !important; }
  .frage, .formel { background: #f4f4f4 !important; }
}

</style>
</head>
<body>

/* ============================================================================
   Azubi Cockpit — Zeichen-Engine (normgerecht)
   Erzeugt technische Zeichnungen als SVG nach:
     - DIN ISO 5455 (Maßstäbe, automatisch gewählt)
     - DIN ISO 128-2 (Linienarten)
     - DIN ISO 129-1 (Bemaßung)
     - DIN ISO 5456-2 (Projektion, europäische Methode)
     - DIN EN ISO 7200 (Schriftfeld) / DIN EN ISO 5457 (Blattformat)
   Regel: Objekt hat reale mm-Maße; Engine skaliert genormt und passt es in den
   Zeichenbereich ein -> nichts läuft über den Rand.
   ==========================================================================*/
window.AZ = window.AZ || {};

AZ.NORM = {
  /* Genormte Maßstäbe DIN ISO 5455 als Faktor (Zeichnung/Wirklichkeit) */
  massstaebe: [
    { r: 50, l: "50:1" }, { r: 20, l: "20:1" }, { r: 10, l: "10:1" },
    { r: 5, l: "5:1" }, { r: 2, l: "2:1" }, { r: 1, l: "1:1" },
    { r: 0.5, l: "1:2" }, { r: 0.2, l: "1:5" }, { r: 0.1, l: "1:10" },
    { r: 0.05, l: "1:20" }, { r: 0.02, l: "1:50" }, { r: 0.01, l: "1:100" },
    { r: 0.005, l: "1:200" }, { r: 0.002, l: "1:500" }, { r: 0.001, l: "1:1000" },
  ],
  /* DIN ISO 2768-1 Grenzabmaße Längenmaße (± mm) je Nennmaßbereich */
  tolLaenge: {
    grenzen: [3, 6, 30, 120, 400, 1000, 2000],
    f: [0.05, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5],
    m: [0.1, 0.1, 0.2, 0.3, 0.5, 0.8, 1.2],
    c: [0.2, 0.3, 0.5, 0.8, 1.2, 2.0, 3.0],
    v: [null, 0.5, 1.0, 1.5, 2.5, 4.0, 6.0],
  },
  /* Blattformate DIN EN ISO 5457 (Breite x Höhe mm) */
  formate: {
    A4quer: [297, 210], A4hoch: [210, 297], A3quer: [420, 297],
  },
};

/* Grenzabmaß ± für ein Nennmaß und eine Toleranzklasse (ISO 2768-1) */
AZ.grenzabmass = function (nennmass, klasse) {
  klasse = klasse || "m";
  var t = AZ.NORM.tolLaenge, g = t.grenzen, arr = t[klasse];
  var n = Math.abs(nennmass);
  for (var i = 0; i < g.length; i++) { if (n <= g[i]) return arr[i]; }
  return arr[arr.length - 1];
};

/* Wählt den größten genormten Maßstab, mit dem (bw x bh) in (tw x th) passt */
AZ.waehleMassstab = function (bw, bh, tw, th) {
  var max = Math.min(tw / bw, th / bh);
  var ms = AZ.NORM.massstaebe;
  for (var i = 0; i < ms.length; i++) { if (ms[i].r <= max + 1e-9) return ms[i]; }
  return ms[ms.length - 1];
};

var _azId = 0;

/* ----------------------------------------------------------------------------
   AZ.Blatt — ein Zeichnungsblatt mit Rahmen + Schriftfeld
   cfg: { format, titel, werkstoff, nummer, ersteller, datum, toleranz,
          projektion:"1", benennungZusatz }
   ---------------------------------------------------------------------------*/
AZ.Blatt = function (cfg) {
  cfg = cfg || {};
  var fmt = AZ.NORM.formate[cfg.format || "A4quer"];
  this.W = fmt[0]; this.H = fmt[1];
  this.cfg = cfg;
  this.uid = "az" + (++_azId);
  this.body = [];            // svg-Elemente des Zeichenbereichs
  this.massstabLabel = cfg.massstab || "1:1";
  // Rahmen/Ränder (ISO 5457: Heftrand links 20, sonst 10)
  this.mL = 20; this.mR = 10; this.mT = 10; this.mB = 10;
  // Schriftfeld (max. 180 breit ISO 7200) unten rechts
  this.sfW = 180; this.sfH = 30;
};

AZ.Blatt.prototype._zeichenbereich = function () {
  // Fläche für die Zeichnung: innerhalb Rahmen, oberhalb Schriftfeld
  return {
    x: this.mL + 6,
    y: this.mT + 6,
    w: (this.W - this.mR) - (this.mL) - 12,
    h: (this.H - this.mB - this.sfH - 6) - (this.mT) - 12,
  };
};

/* Zeichnung platzieren: worldBBox {x,y,w,h} (reale mm inkl. Bemaßung),
   drawFn(pen) zeichnet in Welt-mm. Engine skaliert genormt + zentriert. */
AZ.Blatt.prototype.zeichnung = function (worldBBox, drawFn) {
  var zb = this._zeichenbereich();
  var msf = AZ.waehleMassstab(worldBBox.w, worldBBox.h, zb.w, zb.h);
  var s = msf.r;
  this.massstabLabel = msf.l;
  // Zentrieren im Zeichenbereich
  var drawW = worldBBox.w * s, drawH = worldBBox.h * s;
  var ox = zb.x + (zb.w - drawW) / 2 - worldBBox.x * s;
  var oy = zb.y + (zb.h - drawH) / 2 - worldBBox.y * s;
  var pen = new AZ.Pen(this, s, ox, oy);
  drawFn(pen);
  return this;
};

AZ.Blatt.prototype.push = function (svg) { this.body.push(svg); };

/* Schriftfeld nach DIN EN ISO 7200 (kompakt) */
AZ.Blatt.prototype._schriftfeld = function () {
  var c = this.cfg;
  var x = this.W - this.mR - this.sfW, y = this.H - this.mB - this.sfH;
  var w = this.sfW, h = this.sfH;
  var e = [];
  function box(bx, by, bw, bh) { e.push('<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" class="az-sf"/>'); }
  function k(bx, by, t) { e.push('<text x="' + bx + '" y="' + by + '" class="az-sfk">' + AZ.esc(t) + '</text>'); }
  function v(bx, by, t) { e.push('<text x="' + bx + '" y="' + by + '" class="az-sfv">' + AZ.esc(t) + '</text>'); }
  box(x, y, w, h);
  // Spalten
  var c1 = x, c2 = x + 108, c3 = x + 150;
  e.push('<line x1="' + c2 + '" y1="' + y + '" x2="' + c2 + '" y2="' + (y + h) + '" class="az-sf"/>');
  e.push('<line x1="' + c3 + '" y1="' + y + '" x2="' + c3 + '" y2="' + (y + h) + '" class="az-sf"/>');
  // Zeilen linke Spalte
  e.push('<line x1="' + c1 + '" y1="' + (y + 16) + '" x2="' + c2 + '" y2="' + (y + 16) + '" class="az-sf"/>');
  // Benennung (groß)
  k(c1 + 2, y + 5, "BENENNUNG");
  v(c1 + 2, y + 13, c.titel || "—");
  k(c1 + 2, y + 21, "ALLGEMEINTOLERANZ");
  v(c1 + 2, y + 28, "ISO 2768-" + (c.toleranz || "m"));
  // Mittlere Spalte: Werkstoff / Maßstab
  e.push('<line x1="' + c2 + '" y1="' + (y + 16) + '" x2="' + c3 + '" y2="' + (y + 16) + '" class="az-sf"/>');
  k(c2 + 2, y + 5, "WERKSTOFF"); v(c2 + 2, y + 13, c.werkstoff || "—");
  k(c2 + 2, y + 21, "MASSSTAB"); v(c2 + 2, y + 28, this.massstabLabel);
  // Rechte Spalte: Zeichnungsnr / Datum / Projektionssymbol (je 10 mm Zeile)
  e.push('<line x1="' + c3 + '" y1="' + (y + 10) + '" x2="' + (x + w) + '" y2="' + (y + 10) + '" class="az-sf"/>');
  e.push('<line x1="' + c3 + '" y1="' + (y + 20) + '" x2="' + (x + w) + '" y2="' + (y + 20) + '" class="az-sf"/>');
  k(c3 + 2, y + 4, "ZEICHN.-NR"); v(c3 + 2, y + 8.6, c.nummer || "—");
  k(c3 + 2, y + 14, "DATUM"); v(c3 + 2, y + 18.6, c.datum || "__.__.____");
  // Projektionssymbol (1. Winkel), zentriert in der unteren rechten Zelle
  this._projektion(c3 + 5, y + 25, e);
  return e.join("");
};

AZ.Blatt.prototype._projektion = function (px, py, e) {
  // vereinfachtes Symbol Projektionsmethode 1 (europäisch)
  e.push('<g transform="translate(' + px + ',' + py + ')">' +
    '<path d="M0,-4 L8,-2 L8,2 L0,4 Z" class="az-thin" fill="none"/>' +
    '<circle cx="18" cy="0" r="2.4" class="az-thin" fill="none"/>' +
    '<circle cx="18" cy="0" r="4" class="az-thin" fill="none"/>' +
    '<line x1="8" y1="0" x2="14" y2="0" class="az-thin"/>' +
    '</g>');
};

AZ.Blatt.prototype.svg = function () {
  var vb = "0 0 " + this.W + " " + this.H;
  var frameX = this.mL, frameY = this.mT,
    frameW = this.W - this.mL - this.mR, frameH = this.H - this.mT - this.mB;
  var out = '<svg class="az-blatt" viewBox="' + vb + '" role="img" ' +
    'aria-label="' + AZ.esc(this.cfg.titel || "Technische Zeichnung") + '" ' +
    'preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  out += AZ._defs(this.uid);
  out += AZ._style();
  // Blattfläche + Rahmen
  out += '<rect x="0" y="0" width="' + this.W + '" height="' + this.H + '" fill="#fdfdfb"/>';
  out += '<rect x="' + frameX + '" y="' + frameY + '" width="' + frameW + '" height="' + frameH + '" class="az-frame"/>';
  // Zeichnungsinhalt
  out += '<g marker-mid="">' + this.body.join("") + '</g>';
  // Schriftfeld
  out += this._schriftfeld();
  out += "</svg>";
  return out;
};

/* ----------------------------------------------------------------------------
   AZ.Pen — zeichnet in Welt-mm, transformiert in Blatt-mm (Skalierung s)
   ---------------------------------------------------------------------------*/
AZ.Pen = function (blatt, s, ox, oy) {
  this.b = blatt; this.s = s; this.ox = ox; this.oy = oy;
};
AZ.Pen.prototype.X = function (x) { return +(this.ox + x * this.s).toFixed(3); };
AZ.Pen.prototype.Y = function (y) { return +(this.oy + y * this.s).toFixed(3); };
AZ.Pen.prototype._p = function (svg) { this.b.push(svg); };

AZ.Pen.prototype.rect = function (x, y, w, h, cls) {
  cls = cls || "az-vis";
  this._p('<rect x="' + this.X(x) + '" y="' + this.Y(y) + '" width="' + (w * this.s).toFixed(3) +
    '" height="' + (h * this.s).toFixed(3) + '" class="' + cls + '" fill="none"/>');
};
AZ.Pen.prototype.line = function (x1, y1, x2, y2, cls) {
  cls = cls || "az-vis";
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(y1) + '" x2="' + this.X(x2) + '" y2="' + this.Y(y2) + '" class="' + cls + '"/>');
};
AZ.Pen.prototype.circle = function (cx, cy, r, cls) {
  cls = cls || "az-vis";
  this._p('<circle cx="' + this.X(cx) + '" cy="' + this.Y(cy) + '" r="' + (r * this.s).toFixed(3) + '" class="' + cls + '" fill="none"/>');
};
AZ.Pen.prototype.center = function (x1, y1, x2, y2) { this.line(x1, y1, x2, y2, "az-center"); };
AZ.Pen.prototype.hidden = function (x1, y1, x2, y2) { this.line(x1, y1, x2, y2, "az-hidden"); };
AZ.Pen.prototype.fill = function (x, y, w, h) {
  this._p('<rect x="' + this.X(x) + '" y="' + this.Y(y) + '" width="' + (w * this.s).toFixed(3) +
    '" height="' + (h * this.s).toFixed(3) + '" class="az-part"/>');
};
AZ.Pen.prototype.text = function (x, y, t, cls) {
  cls = cls || "az-dimtx";
  this._p('<text x="' + this.X(x) + '" y="' + this.Y(y) + '" class="' + cls + '">' + AZ.esc(t) + '</text>');
};

/* Bemaßung: Maßhilfslinien (schmal, Überstand), Maßlinie mit Pfeilen, Maßzahl
   dimH(x1,x2, yMass, yKante, opts) — horizontal, Maß = |x2-x1| mm             */
AZ.Pen.prototype.dimH = function (x1, x2, yMass, yKante, opts) {
  opts = opts || {};
  var uid = this.b.uid, over = 1.5; // Überstand Maßhilfslinie mm
  var dir = (yMass < yKante) ? -1 : 1;
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(yKante) + '" x2="' + this.X(x1) + '" y2="' + this.Y(yMass + dir * over) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(x2) + '" y1="' + this.Y(yKante) + '" x2="' + this.X(x2) + '" y2="' + this.Y(yMass + dir * over) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(yMass) + '" x2="' + this.X(x2) + '" y2="' + this.Y(yMass) +
    '" class="az-thin" marker-start="url(#' + uid + 'as)" marker-end="url(#' + uid + 'ae)"/>');
  var t = (opts.text != null) ? opts.text : String(Math.round(Math.abs(x2 - x1)));
  var mx = (x1 + x2) / 2, ty = yMass + dir * 1.4;
  this._p('<text x="' + this.X(mx) + '" y="' + this.Y(ty) + '" class="' + (opts.cls || 'az-dimtx') + '" text-anchor="middle">' + AZ.esc(t) + '</text>');
};
AZ.Pen.prototype.dimV = function (y1, y2, xMass, xKante, opts) {
  opts = opts || {};
  var uid = this.b.uid, over = 1.5;
  var dir = (xMass < xKante) ? -1 : 1;
  this._p('<line x1="' + this.X(xKante) + '" y1="' + this.Y(y1) + '" x2="' + this.X(xMass + dir * over) + '" y2="' + this.Y(y1) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(xKante) + '" y1="' + this.Y(y2) + '" x2="' + this.X(xMass + dir * over) + '" y2="' + this.Y(y2) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(xMass) + '" y1="' + this.Y(y1) + '" x2="' + this.X(xMass) + '" y2="' + this.Y(y2) +
    '" class="az-thin" marker-start="url(#' + uid + 'as)" marker-end="url(#' + uid + 'ae)"/>');
  var t = (opts.text != null) ? opts.text : String(Math.round(Math.abs(y2 - y1)));
  var my = (y1 + y2) / 2, tx = this.X(xMass + dir * 1.6), tyy = this.Y(my);
  this._p('<text x="' + tx + '" y="' + tyy + '" class="' + (opts.cls || 'az-dimtx') + '" text-anchor="middle" transform="rotate(-90 ' + tx + ' ' + tyy + ')">' + AZ.esc(t) + '</text>');
};
/* Durchmesser-Bemaßung als Hinweislinie: ⌀d  */
AZ.Pen.prototype.dimDia = function (cx, cy, r, angDeg, d, opts) {
  opts = opts || {};
  var a = angDeg * Math.PI / 180;
  var x1 = cx + r * Math.cos(a), y1 = cy + r * Math.sin(a);
  var x2 = cx + (r + 8) * Math.cos(a), y2 = cy + (r + 8) * Math.sin(a);
  this.line(x1, y1, x2, y2, "az-thin");
  var t = (opts.text != null) ? opts.text : ("⌀" + d);
  this._p('<text x="' + this.X(x2 + 1) + '" y="' + this.Y(y2) + '" class="' + (opts.cls || 'az-dimtx') + '">' + AZ.esc(t) + '</text>');
};

/* Innengewinde in Vorderansicht (DIN ISO 6410):
   Kernloch = breiter Vollkreis, Gewinde-Nenn-⌀ = schmaler 3/4-Kreis */
AZ.Pen.prototype.gewindeFront = function (cx, cy, dNom, core) {
  this.circle(cx, cy, core / 2, "az-vis");           // Kernloch (breit)
  var r = (dNom / 2) * this.s, X = this.X(cx), Y = this.Y(cy);
  var a0 = Math.PI * 0.13, a1 = Math.PI * 1.87;      // Lücke oben rechts
  var x0 = (X + r * Math.cos(a0)).toFixed(2), y0 = (Y + r * Math.sin(a0)).toFixed(2);
  var x1 = (X + r * Math.cos(a1)).toFixed(2), y1 = (Y + r * Math.sin(a1)).toFixed(2);
  this._p('<path d="M' + x0 + ',' + y0 + ' A' + r.toFixed(2) + ',' + r.toFixed(2) +
    ' 0 1 1 ' + x1 + ',' + y1 + '" class="az-thin" fill="none"/>');
};

/* Schnittschraffur (45°, schmal) innerhalb einer Polygon-Kontur, abzügl. Löcher.
   points/holes: Arrays von [x,y] in Welt-mm (Löcher = Polygon-Arrays) */
AZ.Pen.prototype.hatchPoly = function (points, holes, spacing) {
  spacing = spacing || 2.4;
  var self = this, uid = this.b.uid + "h" + (this.b._hc = (this.b._hc || 0) + 1);
  function poly(pts) {
    return "M" + pts.map(function (p) { return self.X(p[0]) + "," + self.Y(p[1]); }).join(" L") + " Z";
  }
  var d = poly(points);
  (holes || []).forEach(function (ho) { d += " " + poly(ho); });
  this._p('<clipPath id="' + uid + '"><path d="' + d + '" clip-rule="evenodd"/></clipPath>');
  var xs = points.map(function (p) { return p[0]; }), ys = points.map(function (p) { return p[1]; });
  var minx = Math.min.apply(0, xs), maxx = Math.max.apply(0, xs), miny = Math.min.apply(0, ys), maxy = Math.max.apply(0, ys);
  var X0 = this.X(minx), Y0 = this.Y(miny), W = (maxx - minx) * this.s, H = (maxy - miny) * this.s;
  var step = spacing * this.s, lines = "";
  for (var off = -H; off < W; off += step) {
    lines += '<line x1="' + (X0 + off).toFixed(2) + '" y1="' + Y0.toFixed(2) +
      '" x2="' + (X0 + off + H).toFixed(2) + '" y2="' + (Y0 + H).toFixed(2) + '" class="az-thin"/>';
  }
  this._p('<g clip-path="url(#' + uid + ')">' + lines + "</g>");
};

/* Polygonzug (Kontur) zeichnen */
AZ.Pen.prototype.poly = function (points, cls) {
  cls = cls || "az-vis";
  var self = this;
  var d = "M" + points.map(function (p) { return self.X(p[0]) + "," + self.Y(p[1]); }).join(" L") + " Z";
  this._p('<path d="' + d + '" class="' + cls + '" fill="none"/>');
};

/* Polygon-Fläche füllen (Materialtönung) */
AZ.Pen.prototype.fillPoly = function (points) {
  var self = this;
  var d = "M" + points.map(function (p) { return self.X(p[0]) + "," + self.Y(p[1]); }).join(" L") + " Z";
  this._p('<path d="' + d + '" class="az-part"/>');
};

/* Oberflächenangabe DIN EN ISO 21920 (Grundsymbol + Ra), feste mm-Größe */
AZ.Pen.prototype.oberflaeche = function (x, y, ra) {
  var X = this.X(x), Y = this.Y(y);
  this._p('<path d="M' + (X - 2.2) + ',' + Y + ' L' + (X - 0.6) + ',' + (Y + 2.4) +
    ' L' + (X + 2.6) + ',' + (Y - 3.4) + '" class="az-vis" fill="none"/>');
  this._p('<text x="' + (X - 2) + '" y="' + (Y - 1.2) + '" class="az-note">Ra ' + AZ.esc(ra) + '</text>');
};

/* Schnittverlaufslinie (Strichpunkt breit an Enden) mit Pfeilen + Buchstaben */
AZ.Pen.prototype.schnittlinie = function (x1, x2, y, letter) {
  var uid = this.b.uid;
  this.line(x1, y, x2, y, "az-center");
  // Pfeile nach unten (Blickrichtung) + Buchstaben an beiden Enden
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(y) + '" x2="' + this.X(x1) + '" y2="' + this.Y(y + 5) +
    '" class="az-vis" marker-end="url(#' + uid + 'ae)"/>');
  this._p('<line x1="' + this.X(x2) + '" y1="' + this.Y(y) + '" x2="' + this.X(x2) + '" y2="' + this.Y(y + 5) +
    '" class="az-vis" marker-end="url(#' + uid + 'ae)"/>');
  this.text(x1 - 1, y - 1.5, letter, "az-lblb");
  this.text(x2 + 1.5, y - 1.5, letter, "az-lblb");
};

/* ---- gemeinsame Defs / Style (in jedes SVG eingebettet -> druckt s/w) ---- */
AZ._defs = function (uid) {
  // Maßpfeile ~3 mm (userSpaceOnUse = mm, da viewBox in mm)
  return '<defs>' +
    '<marker id="' + uid + 'ae" markerWidth="3.2" markerHeight="2.4" refX="3" refY="1.2" orient="auto" markerUnits="userSpaceOnUse">' +
    '<path d="M0,0.3 L3,1.2 L0,2.1 Z" fill="#1a1a1a"/></marker>' +
    '<marker id="' + uid + 'as" markerWidth="3.2" markerHeight="2.4" refX="0.2" refY="1.2" orient="auto" markerUnits="userSpaceOnUse">' +
    '<path d="M3.2,0.3 L0.2,1.2 L3.2,2.1 Z" fill="#1a1a1a"/></marker>' +
    '</defs>';
};
AZ._style = function () {
  return '<style>' +
    '.az-blatt text{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}' +
    '.az-frame{fill:none;stroke:#1a1a1a;stroke-width:0.5}' +
    '.az-vis{stroke:#1a1a1a;stroke-width:0.5;fill:none;stroke-linecap:round;stroke-linejoin:round}' +
    '.az-thin{stroke:#1a1a1a;stroke-width:0.25;fill:none}' +
    '.az-center{stroke:#1a1a1a;stroke-width:0.25;fill:none;stroke-dasharray:6 1.2 0.8 1.2}' +
    '.az-hidden{stroke:#1a1a1a;stroke-width:0.35;fill:none;stroke-dasharray:2.5 1.2}' +
    '.az-part{fill:#eceae2;stroke:none}' +
    '.az-dimtx{fill:#1a1a1a;font-size:3.2px;font-weight:600}' +
    '.az-note{fill:#1a1a1a;font-size:3px}' +
    '.az-lblb{fill:#1a1a1a;font-size:4px;font-weight:800}' +
    '.az-todo{fill:#E4531D;font-size:4px;font-weight:800}' +
    '.az-sf{fill:none;stroke:#1a1a1a;stroke-width:0.35}' +
    '.az-sfk{fill:#666;font-size:2.4px;letter-spacing:.03em}' +
    '.az-sfv{fill:#1a1a1a;font-size:3.4px;font-weight:700}' +
    '</style>';
};

AZ.esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
};


/* ============================================================================
   Azubi Cockpit — Parametrischer Teile-Generator
   Beschreibt ein Werkstück als Daten -> erzeugt normgerechte Zeichnung
   (Vorderansicht + Schnitt A–A + Bemaßung + Schriftfeld) und leitet daraus
   automatisch die Prüfmaße ab. Baut auf AZ.Blatt / AZ.Pen (zeichnung.js) auf.
   ==========================================================================*/
window.AZ = window.AZ || {};
AZ.parts = AZ.parts || {};

/* Lochkreis-Positionen (Teilkreis) — hier definiert, damit teile.js
   unabhängig von der Ladereihenfolge funktioniert. */
if (typeof azTeilkreis === "undefined") {
  window.azTeilkreis = function (cx, cy, r, n, start, d) {
    var arr = [], a0 = (start == null ? 45 : start) * Math.PI / 180;
    for (var i = 0; i < n; i++) { var a = a0 + i * 2 * Math.PI / n; arr.push({ typ: "bohrung", x: +(cx + r * Math.cos(a)).toFixed(1), y: +(cy + r * Math.sin(a)).toFixed(1), d: d }); }
    return arr;
  };
}

/* Kernlochdurchmesser metr. ISO-Regelgewinde (DIN 13, mm) */
AZ.KERNLOCH = { M3: 2.5, M4: 3.3, M5: 4.2, M6: 5.0, M8: 6.8, M10: 8.5, M12: 10.2 };
/* Steigung P (mm) */
AZ.STEIGUNG = { M3: 0.5, M4: 0.7, M5: 0.8, M6: 1.0, M8: 1.25, M10: 1.5, M12: 1.75 };
/* Grundtoleranz IT9 (µm) je Nennmaßbereich (DIN EN ISO 286) */
AZ.IT9 = { grenzen: [3, 6, 10, 18, 30, 50, 80, 120], w: [25, 30, 36, 43, 52, 62, 74, 87] };

AZ.itWert = function (d, tab) {
  for (var i = 0; i < tab.grenzen.length; i++) if (d <= tab.grenzen[i]) return tab.w[i];
  return tab.w[tab.w.length - 1];
};
/* Passung H9 (Bohrung): unteres Abmaß 0, oberes +IT9 (in mm) */
AZ.passungH9 = function (d) {
  var it = AZ.itWert(d, AZ.IT9) / 1000;
  return { ob: it, un: 0, text: "+" + AZ.mm(it) + " / 0" };
};
AZ.mm = function (v) { return (v).toFixed(3).replace(/0+$/, "").replace(/\.$/, "").replace(".", ","); };

/* -------- Feature normalisieren -------- */
function azNormFeature(f) {
  var g = { typ: f.typ, x: f.x, y: f.y };
  if (f.typ === "gewinde") { g.gew = f.gew; g.nom = parseFloat(f.gew.slice(1)); g.core = AZ.KERNLOCH[f.gew]; }
  else { g.d = f.d; g.passung = f.passung || null; g.senkung = f.senkung || null; }
  return g;
}

/* ==========================================================================
   AZ.parts.platte(spec) — rechteckige Platte mit Bohrungen/Gewinden
   spec: { benennung, nummer, werkstoff, toleranz, w, h, t,
           features:[{typ:'bohrung',x,y,d,passung,senkung:{d}} |
                     {typ:'gewinde',x,y,gew:'M8'}],
           fase, ra, schnitt:true, schnittY }
   ========================================================================== */
AZ.parts.platte = function (spec) {
  spec = Object.assign({ werkstoff: "S235JR", toleranz: "m", schnitt: true, features: [] }, spec);
  spec._features = spec.features.map(azNormFeature);
  if (spec.schnittY == null) spec.schnittY = spec.h / 2;
  return {
    spec: spec,
    svg: function (modus) { return azBuildPlatte(spec, modus === "ergaenzen" ? "ergaenzen" : "fertig"); },
    masse: function () { return azPlatteMasse(spec); },
  };
};

function azBuildPlatte(spec, modus) {
  var voll = (modus === "fertig");
  var w = spec.w, h = spec.h, t = spec.t, fase = spec.fase || 0;
  var b = new AZ.Blatt({
    format: "A4quer", titel: spec.benennung, werkstoff: spec.werkstoff,
    nummer: spec.nummer, toleranz: spec.toleranz, ersteller: "Azubi",
  });
  var schnitt = voll && spec.schnitt && spec._features.length > 0;
  var gap = 15, sy0 = h + gap, sy1 = sy0 + t;
  var yBot = schnitt ? (sy1 + 12) : (h + 12);
  var world = { x: -16, y: -18, w: w + 30, h: yBot + 18 };

  b.zeichnung(world, function (p) {
    /* ---- Vorderansicht ---- */
    p.fill(0, 0, w, h);
    p.rect(0, 0, w, h, "az-vis");
    var feats = spec._features;
    // horizontale Mittellinie auf Schnitthöhe
    p.center(-5, spec.schnittY, w + 5, spec.schnittY);
    feats.forEach(function (f, i) {
      p.center(f.x, -5, f.x, h + 5);
      if (!voll && i > 0) { p.text(f.x - 0.6, f.y + 1.5, "?", "az-todo"); return; }
      if (f.typ === "gewinde") p.gewindeFront(f.x, f.y, f.nom, f.core);
      else { p.circle(f.x, f.y, f.d / 2, "az-vis"); if (f.senkung) p.circle(f.x, f.y, f.senkung.d / 2, "az-thin"); }
    });
    if (schnitt) p.schnittlinie(-6, w + 6, spec.schnittY, "A");

    /* ---- Schnitt A–A ---- */
    if (schnitt) {
      var outline = fase
        ? [[0, sy0 + fase], [fase, sy0], [w - fase, sy0], [w, sy0 + fase], [w, sy1], [0, sy1]]
        : [[0, sy0], [w, sy0], [w, sy1], [0, sy1]];
      var holes = feats.map(function (f) {
        var sw = (f.typ === "gewinde") ? f.core : f.d;
        return [[f.x - sw / 2, sy0], [f.x + sw / 2, sy0], [f.x + sw / 2, sy1], [f.x - sw / 2, sy1]];
      });
      p.hatchPoly(outline, holes, 2.4);
      p.poly(outline, "az-vis");
      feats.forEach(function (f) {
        if (f.typ === "gewinde") {
          p.line(f.x - f.core / 2, sy0, f.x - f.core / 2, sy1, "az-vis");
          p.line(f.x + f.core / 2, sy0, f.x + f.core / 2, sy1, "az-vis");
          p.line(f.x - f.nom / 2, sy0, f.x - f.nom / 2, sy1, "az-thin");
          p.line(f.x + f.nom / 2, sy0, f.x + f.nom / 2, sy1, "az-thin");
        } else {
          p.line(f.x - f.d / 2, sy0, f.x - f.d / 2, sy1, "az-vis");
          p.line(f.x + f.d / 2, sy0, f.x + f.d / 2, sy1, "az-vis");
          if (f.senkung) {
            var dep = (f.senkung.d - f.d) / 2;
            p.line(f.x - f.senkung.d / 2, sy0, f.x - f.d / 2, sy0 + dep, "az-vis");
            p.line(f.x + f.senkung.d / 2, sy0, f.x + f.d / 2, sy0 + dep, "az-vis");
          }
        }
        p.center(f.x, sy0 - 2, f.x, sy1 + 2);
      });
      p.text(w / 2 - 12, sy1 + 10, "SCHNITT A–A", "az-lblb");
    } else if (!voll) {
      p._p('<rect x="' + p.X(0) + '" y="' + p.Y(h + gap) + '" width="' + (w * p.s).toFixed(2) +
        '" height="' + (t * p.s).toFixed(2) + '" class="az-thin" stroke-dasharray="1.5 1.5" fill="none"/>');
      p.text(w / 2 - 14, h + gap + t / 2, "Schnitt A–A ergänzen", "az-note");
    }

    /* ---- Bemaßung ---- */
    if (voll) {
      p.dimH(0, w, -16, 0);
      var xs = feats.map(function (f) { return f.x; }).sort(function (a, c) { return a - c; });
      var prev = 0;
      xs.forEach(function (fx) { if (fx - prev > 0.5) p.dimH(prev, fx, -8, 0); prev = fx; });
      p.dimV(0, h, -14, 0);
      if (schnitt) p.dimV(sy0, sy1, w + 6, w);
      feats.forEach(function (f, i) {
        var ang = (i % 2 === 0) ? -132 : -48;
        if (f.typ === "gewinde") p.dimDia(f.x, f.y, f.nom / 2, ang, null, { text: f.gew });
        else p.dimDia(f.x, f.y, f.d / 2, ang, null, { text: "⌀" + AZ.mm(f.d) + (f.passung ? " " + f.passung : "") });
      });
      if (fase && schnitt) { p.line(fase, sy0, -6, sy0 - 3, "az-thin"); p.text(-15, sy0 - 3.5, AZ.mm(fase) + "×45°", "az-dimtx"); }
      if (spec.ra) p.oberflaeche(w * 0.86, h, spec.ra);
    } else {
      p.dimH(0, w, -16, 0, { text: "?", cls: "az-todo" });
      p.dimV(0, h, -14, 0, { text: "?", cls: "az-todo" });
      var f0 = feats[0];
      if (f0) p.dimDia(f0.x, f0.y, (f0.d || f0.nom) / 2, -132, null, { text: "?", cls: "az-todo" });
    }
  });
  return b.svg();
}

/* Prüfmaße automatisch aus der Werkstückbeschreibung ableiten */
function azPlatteMasse(spec) {
  var kl = spec.toleranz;
  function tolLen(v) { return "±" + AZ.mm(AZ.grenzabmass(v, kl)) + " (2768-" + kl + ")"; }
  var rows = [
    { name: "Länge", soll: AZ.mm(spec.w) + " mm", tol: tolLen(spec.w), mittel: "Messschieber" },
    { name: "Breite", soll: AZ.mm(spec.h) + " mm", tol: tolLen(spec.h), mittel: "Messschieber" },
    { name: "Dicke", soll: AZ.mm(spec.t) + " mm", tol: tolLen(spec.t), mittel: "Messschieber" },
  ];
  spec._features.forEach(function (f) {
    if (f.typ === "gewinde") rows.push({ name: "Gewinde", soll: f.gew, tol: "—", mittel: "Gewindelehrdorn" });
    else if (f.passung === "H9") { var pz = AZ.passungH9(f.d); rows.push({ name: "Passbohrung", soll: "⌀" + AZ.mm(f.d) + " H9", tol: pz.text, mittel: "Grenzlehrdorn" }); }
    else rows.push({ name: "Bohrung", soll: "⌀" + AZ.mm(f.d), tol: "±" + AZ.mm(AZ.grenzabmass(f.d, kl)), mittel: "Messschieber" });
  });
  return rows;
}

/* ==========================================================================
   AZ.parts.biegeteil(spec) — abgekantetes Blechteil (Seitenprofil)
   spec:{ benennung,nummer,werkstoff,toleranz, a (Schenkel waagr.),
          b (Schenkel senkr.), t (Blechdicke), r (Biegeradius), winkel:90 }
   ========================================================================== */
AZ.parts.biegeteil = function (spec) {
  spec = Object.assign({ werkstoff: "S235JR", toleranz: "m", r: 3, winkel: 90 }, spec);
  return {
    spec: spec,
    svg: function (modus) { return azBuildBiege(spec, modus === "ergaenzen" ? "ergaenzen" : "fertig"); },
    masse: function () {
      var kl = spec.toleranz;
      return [

/* ==========================================================================

function azBuildBolzen(spec, modus) {

/* ==========================================================================
   AZ.parts.welle(spec) — Rundteil/Welle mit Absätzen (Seitenansicht)
   spec:{ benennung,nummer,werkstoff,toleranz, abschnitte:[{d,l}], fase }
   ========================================================================== */

  return {
    spec: spec,

function azBuildWelle(spec, modus) {

    p.center(-6, ay, L + 6, ay);

      var xc = 0;

      if (segs.length > 1) p.dimH(0, L, Dmax + 16, Dmax);
      xc = 0;
      segs.forEach(function (s) { var mx = xc + s.l / 2; p.line(mx, ay - s.d / 2, mx, -9, "az-thin"); p.text(mx - 6.5, -10, "⌀" + AZ.mm(s.d), "az-dimtx"); xc += s.l; });
      if (f) p.text(L - f - 8, ay - Dmax / 2 - 2.5, AZ.mm(f) + "×45°", "az-dimtx");
    } else {
      p.dimH(0, L, Dmax + 8, Dmax, { text: "?", cls: "az-todo" });
      var xd = 0; segs.forEach(function (s) { p.text(xd + s.l / 2 - 2, -10, "?", "az-todo"); xd += s.l; });
    }
  });

}

/* ==========================================================================
   AZ.parts.scheibe(spec) — Rundplatte/Flansch mit Lochkreis (Ansicht+Schnitt)
   spec:{ benennung,nummer,werkstoff,toleranz, da, t, bohrung, passung,
          lochkreis:{tk,n,d}, fase }
   ========================================================================== */
AZ.parts.scheibe = function (spec) {
  spec = Object.assign({ werkstoff: "S235JR", toleranz: "m", fase: 0 }, spec);
  return {
    spec: spec,
    svg: function (m) { return azBuildScheibe(spec, m === "ergaenzen" ? "ergaenzen" : "fertig"); },
    masse: function () {
      var kl = spec.toleranz, rows = [
        { name: "Außen-⌀", soll: "⌀" + AZ.mm(spec.da), tol: "±" + AZ.mm(AZ.grenzabmass(spec.da, kl)), mittel: "Messschieber" },
        { name: "Dicke", soll: AZ.mm(spec.t) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.t, kl)), mittel: "Messschieber" },
      ];

function azBuildScheibe(spec, modus) {

  var b = new AZ.Blatt({ format: "A4quer", titel: spec.benennung, werkstoff: spec.werkstoff, nummer: spec.nummer, toleranz: spec.toleranz });
  var gap = 16, sy0 = da + gap, sy1 = sy0 + t;
  var world = { x: -20, y: -18, w: da + 44, h: sy1 + 32 };
  b.zeichnung(world, function (p) {
    var cx = R, cy = R;
    p.circle(cx, cy, R, "az-vis");
    if (cb) p.circle(cx, cy, cb / 2, "az-vis");
    p.center(cx, -6, cx, da + 6); p.center(-6, cy, da + 6, cy);
    if (lk) {
      p._p('<circle cx="' + p.X(cx) + '" cy="' + p.Y(cy) + '" r="' + (lk.tk / 2 * p.s).toFixed(2) + '" class="az-center" fill="none"/>');
      azTeilkreis(cx, cy, lk.tk / 2, lk.n, 45, lk.d).forEach(function (hh) { p.circle(hh.x, hh.y, lk.d / 2, "az-vis"); });
    }
    if (voll) {
      p.schnittlinie(-6, da + 6, cy, "A");
      var outline = f ? [[0, sy0 + f], [f, sy0], [da - f, sy0], [da, sy0 + f], [da, sy1], [0, sy1]] : [[0, sy0], [da, sy0], [da, sy1], [0, sy1]];
      function slot(x0, x1) { return [[x0, sy0], [x1, sy0], [x1, sy1], [x0, sy1]]; }
      var holes = [];
      if (cb) holes.push(slot(cx - cb / 2, cx + cb / 2));
      if (lk) { holes.push(slot(cx - lk.tk / 2 - lk.d / 2, cx - lk.tk / 2 + lk.d / 2)); holes.push(slot(cx + lk.tk / 2 - lk.d / 2, cx + lk.tk / 2 + lk.d / 2)); }
      p.hatchPoly(outline, holes, 2.4); p.poly(outline, "az-vis");

      p.center(cx, sy0 - 3, cx, sy1 + 3);
      if (lk) { p.center(cx - lk.tk / 2, sy0 - 2, cx - lk.tk / 2, sy1 + 2); p.center(cx + lk.tk / 2, sy0 - 2, cx + lk.tk / 2, sy1 + 2); }
      p.text(da / 2 - 12, sy1 + 10, "SCHNITT A–A", "az-lblb");
      p.dimV(sy0, sy1, da + 6, da);
      p.dimDia(cx, cy, R, -45, null, { text: "⌀" + AZ.mm(da) });
      if (cb) p.dimDia(cx, cy, cb / 2, 135, null, { text: "⌀" + AZ.mm(cb) + (spec.passung ? " " + spec.passung : "") });
      if (lk) { p.text(2, -8, lk.n + "×⌀" + AZ.mm(lk.d) + " · Lochkreis ⌀" + AZ.mm(lk.tk), "az-dimtx"); }
    } else {
      p.dimDia(cx, cy, R, -45, null, { text: "⌀?", cls: "az-todo" });
      p.text(da / 2 - 14, sy0 + t / 2, "Schnitt A–A ergänzen", "az-note");

/* ==========================================================================
   AZ.parts.winkel(spec) — L-Profil (flache Winkelplatte), Ansicht + Seitenansicht

AZ.parts.winkel = function (spec) {

    spec: spec,

    masse: function () {
      var kl = spec.toleranz, rows = [
        { name: "Schenkel a", soll: AZ.mm(spec.a) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.a, kl)), mittel: "Messschieber" },
        { name: "Schenkel b", soll: AZ.mm(spec.b) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.b, kl)), mittel: "Messschieber" },
        { name: "Schenkelbreite", soll: AZ.mm(spec.s) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.s, kl)), mittel: "Messschieber" },
        { name: "Dicke", soll: AZ.mm(spec.t) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.t, kl)), mittel: "Messschieber" },
      ];
      (spec.bohrungen || []).forEach(function (f, i) { rows.push({ name: "Bohrung " + (i + 1), soll: "⌀" + AZ.mm(f.d), tol: "±" + AZ.mm(AZ.grenzabmass(f.d, kl)), mittel: "Messschieber" }); });

function azBuildWinkel(spec, modus) {
  var voll = (modus === "fertig");
  var a = spec.a, b = spec.b, s = spec.s, t = spec.t, boh = spec.bohrungen || [];

  var gapS = 14, sideX = a + gapS;
  var world = { x: -16, y: -18, w: a + gapS + t + 30, h: b + 40 };
  B.zeichnung(world, function (p) {

    p.fillPoly(outline); p.poly(outline, "az-vis");
    (voll ? boh : boh.slice(0, 1)).forEach(function (f) {
      p.circle(f.x, f.y, f.d / 2, "az-vis");
      p.center(f.x, f.y - f.d / 2 - 3, f.x, f.y + f.d / 2 + 3); p.center(f.x - f.d / 2 - 3, f.y, f.x + f.d / 2 + 3, f.y);
      if (voll) p.dimDia(f.x, f.y, f.d / 2, -45, null, { text: "⌀" + AZ.mm(f.d) });
    });
    if (voll) {
      p.rect(sideX, 0, t, b, "az-vis");
      boh.forEach(function (f) { p.hidden(sideX, f.y - f.d / 2, sideX + t, f.y - f.d / 2); p.hidden(sideX, f.y + f.d / 2, sideX + t, f.y + f.d / 2); });
      p.dimH(0, a, -8, 0); p.dimV(0, b, -14, 0);
      p.dimH(0, s, b + 8, b); p.dimV(b - s, b, a + 6, a);

      p.dimH(0, a, -8, 0, { text: "?", cls: "az-todo" }); p.dimV(0, b, -14, 0, { text: "?", cls: "az-todo" });
      p.text(sideX - 1, b + 6, "Seitenansicht ergänzen", "az-note");

}

/* ==========================================================================
   AZ.parts.buchse(spec) — Buchse/Hülse (Längsschnitt + Stirnansicht)
   spec:{ benennung,nummer,werkstoff,toleranz, da,di,l, passung, fase }
   ========================================================================== */
AZ.parts.buchse = function (spec) {
  spec = Object.assign({ werkstoff: "S235JR", toleranz: "m", fase: 1 }, spec);
  return {
    spec: spec,
    svg: function (m) { return azBuildBuchse(spec, m === "ergaenzen" ? "ergaenzen" : "fertig"); },
    masse: function () {
      var kl = spec.toleranz;
      return [
        { name: "Außen-⌀", soll: "⌀" + AZ.mm(spec.da), tol: "±" + AZ.mm(AZ.grenzabmass(spec.da, kl)), mittel: "Messschieber" },
        { name: "Bohrung", soll: "⌀" + AZ.mm(spec.di) + (spec.passung ? " " + spec.passung : ""), tol: spec.passung === "H9" ? AZ.passungH9(spec.di).text : "±" + AZ.mm(AZ.grenzabmass(spec.di, kl)), mittel: spec.passung ? "Grenzlehrdorn" : "Innenmessschieber" },
        { name: "Länge", soll: AZ.mm(spec.l) + " mm", tol: "±" + AZ.mm(AZ.grenzabmass(spec.l, kl)), mittel: "Messschieber" },
      ];
    },
  };
};
function azBuildBuchse(spec, modus) {
  var voll = (modus === "fertig");
  var da = spec.da, di = spec.di, l = spec.l, f = spec.fase || 0, ay = da / 2;
  var B = new AZ.Blatt({ format: "A4quer", titel: spec.benennung, werkstoff: spec.werkstoff, nummer: spec.nummer, toleranz: spec.toleranz });
  var gap = 16, cx = l + gap + da / 2;
  var world = { x: -18, y: -18, w: l + gap + da + 40, h: da + 40 };
  B.zeichnung(world, function (p) {
    if (voll) {
      var outline = f ? [[0, f], [f, 0], [l - f, 0], [l, f], [l, da - f], [l - f, da], [f, da], [0, da - f]] : [[0, 0], [l, 0], [l, da], [0, da]];
      var bore = [[0, ay - di / 2], [l, ay - di / 2], [l, ay + di / 2], [0, ay + di / 2]];
      p.hatchPoly(outline, [bore], 2.4); p.poly(outline, "az-vis");
      p.line(0, ay - di / 2, l, ay - di / 2, "az-vis"); p.line(0, ay + di / 2, l, ay + di / 2, "az-vis");
      p.center(-4, ay, l + 4, ay);
      p.dimH(0, l, da + 8, da);
      if (f) p.text(l - f - 6, -2, AZ.mm(f) + "×45°", "az-dimtx");
    } else {
      p._p('<rect x="' + p.X(0) + '" y="' + p.Y(0) + '" width="' + (l * p.s).toFixed(2) + '" height="' + (da * p.s).toFixed(2) + '" class="az-thin" stroke-dasharray="1.5 1.5" fill="none"/>');
      p.text(l / 2 - 14, ay, "Längsschnitt ergänzen", "az-note");
      p.dimH(0, l, da + 8, da, { text: "?", cls: "az-todo" });
    }

    if (voll) {
      p.dimDia(cx, ay, da / 2, -45, null, { text: "⌀" + AZ.mm(da) });
      p.dimDia(cx, ay, di / 2, 135, null, { text: "⌀" + AZ.mm(di) + (spec.passung ? " " + spec.passung : "") });
    } else {
      p.dimDia(cx, ay, da / 2, -45, null, { text: "⌀?", cls: "az-todo" });

function azBuildBiege(spec, modus) {
  var voll = (modus === "fertig");
  var A = spec.a, B = spec.b, t = spec.t, r = spec.r;
  var b = new AZ.Blatt({ format: "A4quer", titel: spec.benennung, werkstoff: spec.werkstoff, nummer: spec.nummer, toleranz: spec.toleranz });
  // Seitenprofil eines rechtwinklig gebogenen Blechs (L), gleichmäßige Dicke t.
  // Senkrechter Schenkel: x[0..t], y[0..B]; waagerechter Schenkel: y[B-t..B], x[0..A].
  var world = { x: -16, y: -16, w: A + 34, h: B + 34 };
  b.zeichnung(world, function (p) {
    var X = function (x) { return p.X(x); }, Y = function (y) { return p.Y(y); };
    var rs = r * p.s;
    // Geschlossene Außenkontur mit Innen-Rundung (Biegeradius r)
    var d = "M" + X(0) + "," + Y(0) +
      " L" + X(t) + "," + Y(0) +
      " L" + X(t) + "," + Y(B - t - r) +
      " A" + rs.toFixed(2) + "," + rs.toFixed(2) + " 0 0 0 " + X(t + r) + "," + Y(B - t) +
      " L" + X(A) + "," + Y(B - t) +
      " L" + X(A) + "," + Y(B) +
      " L" + X(0) + "," + Y(B) + " Z";
    p._p('<path d="' + d + '" class="az-vis" fill="none"/>');
    if (voll) {
      p.dimH(0, A, B + 8, B);            // a
      p.dimV(0, B, -12, 0);              // b
      p.dimV(B - t, B, A + 8, A);        // t
      p.text(t + r + 1.5, B - t - r + 1, "R" + AZ.mm(r), "az-dimtx");
      p.text(t + 3.5, B - t - r - 4, spec.winkel + "°", "az-dimtx");
    } else {
      p.dimH(0, A, B + 8, B, { text: "?", cls: "az-todo" });
      p.dimV(0, B, -12, 0, { text: "?", cls: "az-todo" });
      p.text(t + 3.5, B - t - r - 4, "?", "az-todo");

/* Lochkreis-Positionen (Teilkreis) */
function azTeilkreis(cx, cy, r, n, start, d) {
  var arr = [], a0 = (start == null ? 45 : start) * Math.PI / 180;
  for (var i = 0; i < n; i++) { var a = a0 + i * 2 * Math.PI / n; arr.push({ typ: "bohrung", x: +(cx + r * Math.cos(a)).toFixed(1), y: +(cy + r * Math.sin(a)).toFixed(1), d: d }); }
  return arr;
}

/* Messschieber-Ablesung (Nonius 1/20 = 0,05 mm), korrekt konstruiert.
   value als Vielfaches von 0,05. Liefert ein eigenständiges SVG.            */
function azMessschieber(value) {
  var N = Math.floor(value), m = Math.round((value - N) / 0.05); // 0..19
  var PXmm = 7, y0 = 26, yN = 44, hpad = 12;
  var mmMax = N + 44;
  var W = mmMax * PXmm + hpad * 2, H = 68;
  function X(mm) { return (hpad + mm * PXmm).toFixed(1); }
  var s = '<svg viewBox="0 0 ' + W.toFixed(0) + ' ' + H + '" class="msch" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  s += '<style>.mm{stroke:#1a1a1a;stroke-width:0.8}.mm5{stroke:#1a1a1a;stroke-width:1}.non{stroke:#1a1a1a;stroke-width:0.8}' +
    '.hit{stroke:#E4531D;stroke-width:1.6}.ptr{stroke:#E4531D;stroke-width:1}.txt{font-family:ui-monospace,monospace;font-size:7px;fill:#1a1a1a}' +
    '.txt2{font-family:ui-monospace,monospace;font-size:6px;fill:#666}.bar{fill:#f0efe9;stroke:#1a1a1a;stroke-width:0.6}</style>';
  s += '<rect x="' + hpad + '" y="' + (y0 - 14) + '" width="' + (mmMax * PXmm) + '" height="12" class="bar"/>';
  // Hauptskala (mm)
  for (var mm = 0; mm <= mmMax; mm++) {
    var big = (mm % 10 === 0), mid = (mm % 5 === 0);
    var hgt = big ? 12 : (mid ? 8 : 5);
    s += '<line x1="' + X(mm) + '" y1="' + (y0 - 2) + '" x2="' + X(mm) + '" y2="' + (y0 - 2 - hgt) + '" class="' + (mid ? "mm5" : "mm") + '"/>';
    if (big) s += '<text x="' + X(mm) + '" y="' + (y0 - 15) + '" text-anchor="middle" class="txt2">' + (mm / 10) + '</text>';
  }
  // Nonius-Träger
  s += '<rect x="' + X(value) + '" y="' + (yN - 2) + '" width="' + (39 * PXmm) + '" height="12" class="bar"/>';
  for (var k = 0; k <= 20; k++) {
    var nx = value + k * 1.95;
    var cls = (k === m) ? "hit" : "non";
    s += '<line x1="' + X(nx) + '" y1="' + (yN) + '" x2="' + X(nx) + '" y2="' + (yN + 8) + '" class="' + cls + '"/>';
    if (k % 5 === 0) s += '<text x="' + X(nx) + '" y="' + (yN + 16) + '" text-anchor="middle" class="txt2">' + (k / 2) + '</text>';
  }
  // Zeiger (Nonius-Null) + Markierung der koinzidierenden Linie
  s += '<line x1="' + X(value) + '" y1="' + (y0 - 2) + '" x2="' + X(value) + '" y2="' + (yN + 8) + '" class="ptr" stroke-dasharray="2 1.5"/>';
  s += '</svg>';
  return s;
}

/* Genormte Piktogramme (DIN EN ISO 7010) – als SVG nachgebildet.
   kind -> {svg, code, name}                                                    */
function azSign(kind) {
  var B = AZ_SIG, s = "", code = "", name = "";
  function gebot(inner) { return '<circle cx="24" cy="24" r="22" fill="' + B.blau + '"/>' + inner; }

  switch (kind) {

      code = "M004"; name = "Augenschutz benutzen";

      code = "M003"; name = "Gehörschutz benutzen";

        '<rect x="32" y="25.5" width="6.5" height="9.5" rx="3" fill="#fff"/>');
      break;
    case "fussschutz": // M008 — Sicherheitsschuh (Profil)
      code = "M008"; name = "Fußschutz benutzen";

    case "handschuhverbot": // P028 — Benutzen von Handschuhen verboten

        '<rect x="27.8" y="15" width="2.6" height="11" rx="1.3"/>' +
        '<path d="M18 27 l-4.5 -2.2 a2 2 0 0 1 1.8 -3.6 l3.4 1.7 z"/></g>');
      break;
    case "warnung": // W001 allgemeines Warnzeichen
      code = "W001"; name = "Allgemeines Warnzeichen";
      s = '<path d="M24 4 L44 39 H4 Z" fill="' + B.gelb + '" stroke="' + B.schwarz + '" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<rect x="22" y="16" width="4" height="12" fill="' + B.schwarz + '"/><rect x="22" y="31" width="4" height="4" fill="' + B.schwarz + '"/>';
      break;
    case "ersthilfe": // E003
      code = "E003"; name = "Erste Hilfe";
      s = '<rect x="3" y="3" width="42" height="42" rx="3" fill="' + B.gruen + '"/>' +
        '<path d="M20 11 h8 v9 h9 v8 h-9 v9 h-8 v-9 h-9 v-8 h9 z" fill="#fff"/>';
      break;
    case "feuerloescher": // F001
      code = "F001"; name = "Feuerlöscher";
      s = '<rect x="3" y="3" width="42" height="42" rx="3" fill="' + B.rot + '"/>' +
        '<g fill="#fff"><rect x="18" y="17" width="12" height="21" rx="3"/><rect x="21.5" y="11" width="5" height="6" rx="1"/></g>' +
        '<path d="M26 13 q7 0 7 7" stroke="#fff" stroke-width="2" fill="none"/>';
      break;
  }
  // Wenn eine offizielle, lizenzierte Datei hinterlegt ist -> diese verwenden.
  var official = (window.AZ_SIGN_OVERRIDES || {})[code];
  var svg = official
    ? '<span class="sign sign-official" role="img" aria-label="' + name + '">' + official + "</span>"
    : '<svg viewBox="0 0 48 48" class="sign" role="img" aria-label="' + name + '">' + s + "</svg>";
  return { svg: svg, code: code, name: name, official: !!official };
}
function azSignCard(kind) {
  var x = azSign(kind);
  return '<div class="sign-card">' + x.svg + '<div><strong>' + x.name + '</strong><small>ISO 7010 · ' + x.code + '</small></div></div>';
}

/* ---- Hilfen: Aufgabenstellung, Prüftabelle, Zeichnung mit Umschalter ---- */
function azFeatureText(spec) {
  var map = {}, order = [];
  (spec.features || []).forEach(function (f) {
    var key = f.typ === "gewinde" ? ("Gewinde " + f.gew)
      : ("Bohrung ⌀" + AZ.mm(f.d) + (f.passung ? " " + f.passung : "") + (f.senkung ? " mit Senkung ⌀" + AZ.mm(f.senkung.d) : ""));
    if (!(key in map)) { map[key] = 0; order.push(key); } map[key]++;
  });
  var parts = order.map(function (k) { return (map[k] > 1 ? map[k] + "× " : "") + k; });
  if (spec.fase) parts.push("Fase " + AZ.mm(spec.fase) + "×45°");
  return parts.join(", ");
}
function azAufgabenstellung(api) {
  var s = api.spec;
  var maße = s.w ? (AZ.mm(s.w) + " × " + AZ.mm(s.h) + " × " + AZ.mm(s.t) + " mm")

      : ("Schenkel " + AZ.mm(s.a) + " / " + AZ.mm(s.b) + " mm, Dicke " + AZ.mm(s.t) + " mm"));
  var ft = s.features ? azFeatureText(s) : (s.gew ? "Außengewinde " + s.gew : "");
  return "Fertige das Werkstück <strong>" + AZ.esc(s.benennung) + "</strong> nach Zeichnung <em>" + s.nummer +
    "</em> auf Endmaß <strong>" + maße + "</strong>" + (ft ? " mit: " + ft : "") + ". Prüfe die Maße nach Zeichnung.";
}
function azMasseTable(api) {

  function wireSkizze() {
    var svg = document.getElementById("skcanvas"), content = document.getElementById("sk-content"),
      preview = document.getElementById("sk-preview"), cursor = document.getElementById("sk-cursor"),
      hint = document.getElementById("sk-hint");
    var GRID = 5, els = [], tool = "linie", pending = null, snap = true;

    function toMM(evt) {

      var x = (evt.clientX - r.left) / r.width * 260, y = (evt.clientY - r.top) / r.height * 180;
      if (snap) { x = Math.round(x / GRID) * GRID; y = Math.round(y / GRID) * GRID; }
      return { x: Math.max(0, Math.min(260, +x.toFixed(1))), y: Math.max(0, Math.min(180, +y.toFixed(1))) };
    }
    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
    function makeEl(t, p1, p2) {
      if (t === "linie") return { type: "line", cls: "vis", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
      if (t === "center") return { type: "line", cls: "center", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
      if (t === "kreis") return { type: "circle", cx: p1.x, cy: p1.y, r: +Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2)).toFixed(1) };
      if (t === "rechteck") return { type: "rect", x: Math.min(p1.x, p2.x), y: Math.min(p1.y, p2.y), w: Math.abs(p2.x - p1.x), h: Math.abs(p2.y - p1.y) };

      if (e.type === "circle") return '<circle cx="' + e.cx + '" cy="' + e.cy + '" r="' + e.r + '" class="' + c + '" fill="none"/>';
      if (e.type === "rect") return '<rect x="' + e.x + '" y="' + e.y + '" width="' + e.w + '" height="' + e.h + '" class="' + c + '" fill="none"/>';
      if (e.type === "text") return '<text x="' + e.x + '" y="' + e.y + '" class="sk-text">' + esc(e.text) + '</text>';

        var mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
        if (ang > 90 || ang < -90) ang += 180;
        return '<line x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" class="' + (prev ? "sk-prev" : "sk-dim") + '" marker-start="url(#skas)" marker-end="url(#skae)"/>' +
          (prev ? "" : '<text x="' + mx + '" y="' + (my - 1.4) + '" text-anchor="middle" class="sk-dimtx" transform="rotate(' + ang.toFixed(1) + ' ' + mx + ' ' + my + ')">' + Math.round(dist) + '</text>');
      }

    function setHint(msg) { if (hint) hint.textContent = msg; }

    function segDist(px, py, x1, y1, x2, y2) {

      var tt = L2 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0; tt = Math.max(0, Math.min(1, tt));

    function elDist(e, p) {
      if (e.type === "line" || e.type === "dim") return segDist(p.x, p.y, e.x1, e.y1, e.x2, e.y2);
      if (e.type === "circle") return Math.abs(Math.sqrt(Math.pow(p.x - e.cx, 2) + Math.pow(p.y - e.cy, 2)) - e.r);
      if (e.type === "rect") return Math.min(segDist(p.x, p.y, e.x, e.y, e.x + e.w, e.y), segDist(p.x, p.y, e.x, e.y + e.h, e.x + e.w, e.y + e.h), segDist(p.x, p.y, e.x, e.y, e.x, e.y + e.h), segDist(p.x, p.y, e.x + e.w, e.y, e.x + e.w, e.y + e.h));
      if (e.type === "text") return Math.sqrt(Math.pow(p.x - e.x, 2) + Math.pow(p.y - e.y, 2));

    function deleteNear(p) {

    svg.addEventListener("click", function (evt) {

    });
    svg.addEventListener("mousemove", function (evt) {
      var p = toMM(evt);
      cursor.setAttribute("cx", p.x); cursor.setAttribute("cy", p.y); cursor.style.display = "";
      if (pending && tool !== "text" && tool !== "loeschen") { var e = makeEl(tool, pending, p); preview.innerHTML = e ? elSvg(e, true) : ""; }
    });
    svg.addEventListener("mouseleave", function () { cursor.style.display = "none"; });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { pending = null; preview.innerHTML = ""; setHint(toolLabel() + " — ersten Punkt klicken."); } });

    Array.prototype.forEach.call(document.querySelectorAll(".sk-tool"), function (btn) {
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(document.querySelectorAll(".sk-tool"), function (b) { b.classList.toggle("active", b === btn); });
        tool = btn.getAttribute("data-tool"); pending = null; preview.innerHTML = "";
        setHint(toolLabel() + (tool === "text" ? " — Position klicken." : tool === "loeschen" ? " — Element anklicken." : " — ersten Punkt klicken."));
      });
    });
    document.getElementById("sk-snap").addEventListener("change", function () { snap = this.checked; });
    document.getElementById("sk-undo").addEventListener("click", function () { els.pop(); pending = null; preview.innerHTML = ""; render(); });
    document.getElementById("sk-clear").addEventListener("click", function () { if (window.confirm("Skizze leeren?")) { els = []; pending = null; preview.innerHTML = ""; render(); } });
    document.getElementById("sk-titel").addEventListener("input", function () { document.getElementById("sk-title").textContent = this.value; });
    document.getElementById("sk-print").addEventListener("click", function () {
      document.body.classList.add("print-blatt"); window.print();
      setTimeout(function () { document.body.classList.remove("print-blatt"); }, 300);
    });
    document.getElementById("sk-title").textContent = "Skizze";
    if (location.hash.indexOf("demo") >= 0) {
      els = [
        { type: "rect", x: 70, y: 55, w: 120, h: 70 },
        { type: "circle", cx: 130, cy: 90, r: 22 },
        { type: "line", cls: "center", x1: 130, y1: 45, x2: 130, y2: 135 },
        { type: "line", cls: "center", x1: 60, y1: 90, x2: 200, y2: 90 },
        { type: "dim", x1: 70, y1: 140, x2: 190, y2: 140 },
        { type: "dim", x1: 55, y1: 55, x2: 55, y2: 125 },
        { type: "text", x: 78, y: 50, text: "Demo-Skizze" },
      ];
      render();
    }
  }

  /* ---------- Router ---------- */
  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    window.scrollTo(0, 0);
    if (parts.length === 0) return viewStart();
    if (parts[0] === "tools") return parts[1] === "skizze" ? viewSkizze() : viewCreator();
    if (parts[0] === "lj") return viewLj(parts[1]);
    if (parts[0] === "modul" && parts.length >= 3) return viewBlatt(parts[1], parts[2]);
    if (parts[0] === "modul") return viewModul(parts[1]);
    return viewStart();
  }

  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);
  if (document.readyState !== "loading") route();
})();


(function(){var t=document.getElementById('themeToggle');if(!t)return;t.addEventListener('click',function(e){e.preventDefault();var r=document.documentElement;var c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':'dark');});})();
</script>
