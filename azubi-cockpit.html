<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azubi Cockpit — Mechatroniker/in</title>
<meta name="description" content="Digitales Ausbildungs-Cockpit fuer Mechatroniker/innen: Ausbildungsrahmenplan und Lernfelder, druckfertige Arbeitsblaetter, normgerechte technische Zeichnungen, Loesungshefte.">
<style>
/* ============================================================================
   Azubi Cockpit — Cockpit-UI (Design: Werkstatt / Blaupause, Theme-aware)
   ==========================================================================*/
:root{
  --ground:#EAEDE8; --panel:#FBFCFA; --panel-2:#F1F3EF;
  --ink:#15181B; --ink-2:#4A525B; --ink-3:#79828B;
  --line:#CDD3CE; --line-strong:#AEB6AF;
  --accent:#E4531D; --accent-ink:#fff; --blue:#0F6E78; --ok:#3F7D3A; --warn:#C8860B;
  --grid: color-mix(in srgb, var(--line) 55%, transparent);
  --font-body: system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --r:5px;
}
@media (prefers-color-scheme:dark){
  :root{--ground:#0E1113;--panel:#161A1D;--panel-2:#1C2124;--ink:#ECEFEB;--ink-2:#9AA4AC;--ink-3:#6C757D;
    --line:#2A3033;--line-strong:#3A4247;--accent:#FF6A38;--accent-ink:#160a04;--blue:#45B5C0;--ok:#67B95F;--warn:#E7AE3A;
    --grid:color-mix(in srgb,var(--line) 85%,transparent);}
}
:root[data-theme="light"]{--ground:#EAEDE8;--panel:#FBFCFA;--panel-2:#F1F3EF;--ink:#15181B;--ink-2:#4A525B;--ink-3:#79828B;
  --line:#CDD3CE;--line-strong:#AEB6AF;--accent:#E4531D;--accent-ink:#fff;--blue:#0F6E78;--ok:#3F7D3A;--warn:#C8860B;--grid:color-mix(in srgb,var(--line) 55%,transparent);}
:root[data-theme="dark"]{--ground:#0E1113;--panel:#161A1D;--panel-2:#1C2124;--ink:#ECEFEB;--ink-2:#9AA4AC;--ink-3:#6C757D;
  --line:#2A3033;--line-strong:#3A4247;--accent:#FF6A38;--accent-ink:#160a04;--blue:#45B5C0;--ok:#67B95F;--warn:#E7AE3A;--grid:color-mix(in srgb,var(--line) 85%,transparent);}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono)}

/* ---- Topbar ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:12px clamp(14px,4vw,32px);background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line-strong)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:18px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.brand small{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{font-family:var(--font-mono);font-size:12.5px;padding:6px 11px;border-radius:100px;border:1px solid transparent;color:var(--ink-2)}
.nav a:hover{border-color:var(--line-strong);color:var(--ink)}
.nav a.active{background:var(--accent);color:var(--accent-ink);font-weight:700}

.wrap{max-width:1060px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(14px,4vw,32px)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,6vw,52px);line-height:1;margin:.1em 0 .2em;text-wrap:balance}
h2{font-weight:800;letter-spacing:-.01em;font-size:clamp(22px,3.4vw,32px);margin:0 0 .3em}
p{color:var(--ink-2);max-width:70ch}
.lead{font-size:clamp(16px,2.1vw,19px);color:var(--ink);max-width:62ch}
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-bottom:14px}
.crumb a{color:var(--accent)}
section{margin-top:clamp(34px,5vw,60px)}

/* ---- Prinzip flow ---- */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:720px){.flow{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px}
.step .num{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700}
.step h3{margin:6px 0 4px;font-size:16px}
.step p{font-size:13.5px;margin:0}

/* ---- Duale Info ---- */
.duale{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:640px){.duale{grid-template-columns:1fr}}
.duale .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px 18px}
.duale .card h3{margin:0 0 4px;font-size:16px}
.duale .card small{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---- Lehrjahr cards ---- */
.lj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:820px){.lj-grid{grid-template-columns:1fr}}
.lj-card{display:block;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s}
.lj-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.lj-card .lj{font-family:var(--font-mono);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:3px;display:inline-block}
.lj-card h3{margin:12px 0 4px;font-size:19px}
.lj-card p{font-size:13.5px;margin:0 0 12px}
.progress{height:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:100px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}
.lj-card .pmeta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:6px;display:flex;justify-content:space-between}

/* ---- Modul list ---- */
.mod-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mod-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.mod-row:hover{border-color:var(--accent)}
.mod-row.locked{opacity:.7}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:700;white-space:nowrap}
.badge.fertig{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.badge.geruest{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-strong)}
.mod-row h3{margin:0 0 2px;font-size:16px}
.mod-row .sub{font-size:12.5px;color:var(--ink-3)}
.mod-row .weeks{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.mod-row .fach{font-family:var(--font-mono);font-size:10.5px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}

/* ---- Lernfelder box ---- */
.lf-box{background:var(--panel);border:1px solid var(--line-strong);border-left:3px solid var(--blue);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.lf-box h3{margin:0 0 8px;font-size:15px}
.lf-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.lf-item:last-child{border-bottom:0}
.lf-item .n{font-family:var(--font-mono);font-weight:700;color:var(--blue)}
.lf-item .h{font-family:var(--font-mono);color:var(--ink-3);font-size:12px}

/* ---- Modul-Detailleiste ---- */
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:4px 10px;border-radius:100px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--panel)}
.chip b{color:var(--ink)}

/* ---- Bausteine (Blätter) ---- */
.baustein-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(max-width:700px){.baustein-grid{grid-template-columns:1fr}}
.bs{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.bs:hover{border-color:var(--accent)}
.bs .t{flex:1}
.bs .t h3{margin:0;font-size:15px}
.bs .t small{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.typ{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:3px}
.typ.aufgabe{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent)}
.typ.theorie{background:color-mix(in srgb,var(--blue) 16%,var(--panel));color:var(--blue)}
.typ.zeichnung{background:color-mix(in srgb,var(--blue) 16%,var(--panel));color:var(--blue)}
.typ.praxis{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent)}
.typ.sicherheit{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.typ.loesung{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}

/* ---- Blatt (Detail) ---- */
.blatt-print{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:clamp(18px,3vw,32px);margin-top:16px}
.blatt-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.blatt-head .no{font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);background:var(--accent);padding:4px 10px;border-radius:3px;font-size:13px}
.blatt-head h2{margin:0;font-size:20px}
.blatt-head .app-tag{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.blatt-print h3{font-size:16px;margin:18px 0 6px}
.blatt-print p{color:var(--ink);font-size:14.5px}
.bl-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.bl-meta span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:100px;padding:2px 9px}
.bl-meta.ok span{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.ul,.ol{margin:6px 0;padding-left:22px}.ul li,.ol li{margin:4px 0;color:var(--ink);font-size:14.5px}
.frage{background:var(--panel-2);border:1px dashed var(--line-strong);border-radius:4px;padding:10px 12px;font-size:14px;color:var(--ink)!important}
.formel{font-family:var(--font-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 12px;display:inline-block;color:var(--ink)!important}
.tab{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.tab th,.tab td{border:1px solid var(--line-strong);padding:7px 10px;text-align:left}
.tab th{background:var(--panel-2);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.tab td{color:var(--ink)}
.chk{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14.5px;color:var(--ink)}
.box{width:16px;height:16px;border:1.6px solid var(--line-strong);border-radius:3px;flex:none;margin-top:2px}
.chk-hint{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)!important}
.unterschrift{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-strong);font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.zeichnung-halter{border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:#fdfdfb;margin:10px 0}
.zeichnung-halter .az-blatt{display:block;width:100%;height:auto}

/* Sicherheitszeichen */
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.sign-card{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.sign-card small{display:block;color:var(--ink-3);font-size:11.5px}
.sign{width:38px;height:38px;flex:none}

/* Buttons */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:9px 16px;border-radius:100px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.footer{margin-top:60px;padding:22px 0;border-top:1px solid var(--line-strong);font-family:var(--font-mono);font-size:12px;color:var(--ink-3);text-align:center}
.note-mark{color:var(--accent);font-weight:700}

/* ============================================================================
   Druck: nur das aktuelle Blatt drucken (DIN A4), Rest ausblenden.
   Aktiviert über <body class="print-blatt"> beim Drucken eines Blatts.
   ==========================================================================*/
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff !important; }
  .topbar, .nav, .btnrow, .pager, .footer, .crumb { display: none !important; }

  /* Standard: Seite druckbar */
  body.print-blatt .wrap > *:not(.blatt-print) { display: none !important; }
  body.print-blatt .blatt-print {
    border: none !important; margin: 0 !important; padding: 0 !important;
    background: #fff !important; color: #000 !important;
  }
  .blatt-print, .blatt-print * { color: #000 !important; }
  .blatt-head { border-color: #000 !important; }
  .blatt-head .no { background: #000 !important; color: #fff !important; }
  .zeichnung-halter { border: none !important; page-break-inside: avoid; }
  .az-blatt { width: 100% !important; }
  .tab th { background: #eee !important; }
  .frage, .formel { background: #f4f4f4 !important; }
}

</style>
</head>

<script>

  ],

  lehrjahre: [
    /* ------------------------------------------------------------------ LJ1 */
    {
      nr: 1,

          normen: ["DIN ISO 128-2", "DIN ISO 129-1", "DIN ISO 5455", "DIN EN ISO 7200"],

        {

          fach: "Arbeitsplanung",

        {

/* ============================================================================
   Azubi Cockpit — Zeichen-Engine (normgerecht)
   Erzeugt technische Zeichnungen als SVG nach:
     - DIN ISO 5455 (Maßstäbe, automatisch gewählt)
     - DIN ISO 128-2 (Linienarten)
     - DIN ISO 129-1 (Bemaßung)
     - DIN ISO 5456-2 (Projektion, europäische Methode)
     - DIN EN ISO 7200 (Schriftfeld) / DIN EN ISO 5457 (Blattformat)
   Regel: Objekt hat reale mm-Maße; Engine skaliert genormt und passt es in den
   Zeichenbereich ein -> nichts läuft über den Rand.
   ==========================================================================*/
window.AZ = window.AZ || {};

AZ.NORM = {
  /* Genormte Maßstäbe DIN ISO 5455 als Faktor (Zeichnung/Wirklichkeit) */
  massstaebe: [
    { r: 50, l: "50:1" }, { r: 20, l: "20:1" }, { r: 10, l: "10:1" },
    { r: 5, l: "5:1" }, { r: 2, l: "2:1" }, { r: 1, l: "1:1" },
    { r: 0.5, l: "1:2" }, { r: 0.2, l: "1:5" }, { r: 0.1, l: "1:10" },
    { r: 0.05, l: "1:20" }, { r: 0.02, l: "1:50" }, { r: 0.01, l: "1:100" },
    { r: 0.005, l: "1:200" }, { r: 0.002, l: "1:500" }, { r: 0.001, l: "1:1000" },
  ],
  /* DIN ISO 2768-1 Grenzabmaße Längenmaße (± mm) je Nennmaßbereich */
  tolLaenge: {
    grenzen: [3, 6, 30, 120, 400, 1000, 2000],
    f: [0.05, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5],
    m: [0.1, 0.1, 0.2, 0.3, 0.5, 0.8, 1.2],
    c: [0.2, 0.3, 0.5, 0.8, 1.2, 2.0, 3.0],
    v: [null, 0.5, 1.0, 1.5, 2.5, 4.0, 6.0],
  },
  /* Blattformate DIN EN ISO 5457 (Breite x Höhe mm) */
  formate: {
    A4quer: [297, 210], A4hoch: [210, 297], A3quer: [420, 297],
  },
};

/* Grenzabmaß ± für ein Nennmaß und eine Toleranzklasse (ISO 2768-1) */
AZ.grenzabmass = function (nennmass, klasse) {
  klasse = klasse || "m";
  var t = AZ.NORM.tolLaenge, g = t.grenzen, arr = t[klasse];
  var n = Math.abs(nennmass);
  for (var i = 0; i < g.length; i++) { if (n <= g[i]) return arr[i]; }
  return arr[arr.length - 1];
};

/* Wählt den größten genormten Maßstab, mit dem (bw x bh) in (tw x th) passt */
AZ.waehleMassstab = function (bw, bh, tw, th) {
  var max = Math.min(tw / bw, th / bh);
  var ms = AZ.NORM.massstaebe;
  for (var i = 0; i < ms.length; i++) { if (ms[i].r <= max + 1e-9) return ms[i]; }
  return ms[ms.length - 1];
};

var _azId = 0;

/* ----------------------------------------------------------------------------
   AZ.Blatt — ein Zeichnungsblatt mit Rahmen + Schriftfeld
   cfg: { format, titel, werkstoff, nummer, ersteller, datum, toleranz,
          projektion:"1", benennungZusatz }
   ---------------------------------------------------------------------------*/
AZ.Blatt = function (cfg) {
  cfg = cfg || {};
  var fmt = AZ.NORM.formate[cfg.format || "A4quer"];
  this.W = fmt[0]; this.H = fmt[1];
  this.cfg = cfg;
  this.uid = "az" + (++_azId);
  this.body = [];            // svg-Elemente des Zeichenbereichs
  this.massstabLabel = cfg.massstab || "1:1";
  // Rahmen/Ränder (ISO 5457: Heftrand links 20, sonst 10)
  this.mL = 20; this.mR = 10; this.mT = 10; this.mB = 10;
  // Schriftfeld (max. 180 breit ISO 7200) unten rechts
  this.sfW = 180; this.sfH = 30;
};

AZ.Blatt.prototype._zeichenbereich = function () {
  // Fläche für die Zeichnung: innerhalb Rahmen, oberhalb Schriftfeld
  return {
    x: this.mL + 6,
    y: this.mT + 6,
    w: (this.W - this.mR) - (this.mL) - 12,
    h: (this.H - this.mB - this.sfH - 6) - (this.mT) - 12,
  };
};

/* Zeichnung platzieren: worldBBox {x,y,w,h} (reale mm inkl. Bemaßung),
   drawFn(pen) zeichnet in Welt-mm. Engine skaliert genormt + zentriert. */
AZ.Blatt.prototype.zeichnung = function (worldBBox, drawFn) {
  var zb = this._zeichenbereich();
  var msf = AZ.waehleMassstab(worldBBox.w, worldBBox.h, zb.w, zb.h);
  var s = msf.r;
  this.massstabLabel = msf.l;
  // Zentrieren im Zeichenbereich
  var drawW = worldBBox.w * s, drawH = worldBBox.h * s;
  var ox = zb.x + (zb.w - drawW) / 2 - worldBBox.x * s;
  var oy = zb.y + (zb.h - drawH) / 2 - worldBBox.y * s;
  var pen = new AZ.Pen(this, s, ox, oy);
  drawFn(pen);
  return this;
};

AZ.Blatt.prototype.push = function (svg) { this.body.push(svg); };

/* Schriftfeld nach DIN EN ISO 7200 (kompakt) */
AZ.Blatt.prototype._schriftfeld = function () {
  var c = this.cfg;
  var x = this.W - this.mR - this.sfW, y = this.H - this.mB - this.sfH;
  var w = this.sfW, h = this.sfH;
  var e = [];
  function box(bx, by, bw, bh) { e.push('<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" class="az-sf"/>'); }
  function k(bx, by, t) { e.push('<text x="' + bx + '" y="' + by + '" class="az-sfk">' + AZ.esc(t) + '</text>'); }
  function v(bx, by, t) { e.push('<text x="' + bx + '" y="' + by + '" class="az-sfv">' + AZ.esc(t) + '</text>'); }
  box(x, y, w, h);
  // Spalten
  var c1 = x, c2 = x + 108, c3 = x + 150;
  e.push('<line x1="' + c2 + '" y1="' + y + '" x2="' + c2 + '" y2="' + (y + h) + '" class="az-sf"/>');
  e.push('<line x1="' + c3 + '" y1="' + y + '" x2="' + c3 + '" y2="' + (y + h) + '" class="az-sf"/>');
  // Zeilen linke Spalte
  e.push('<line x1="' + c1 + '" y1="' + (y + 16) + '" x2="' + c2 + '" y2="' + (y + 16) + '" class="az-sf"/>');
  // Benennung (groß)
  k(c1 + 2, y + 5, "BENENNUNG");
  v(c1 + 2, y + 13, c.titel || "—");
  k(c1 + 2, y + 21, "ALLGEMEINTOLERANZ");
  v(c1 + 2, y + 28, "ISO 2768-" + (c.toleranz || "m"));
  // Mittlere Spalte: Werkstoff / Maßstab
  e.push('<line x1="' + c2 + '" y1="' + (y + 16) + '" x2="' + c3 + '" y2="' + (y + 16) + '" class="az-sf"/>');
  k(c2 + 2, y + 5, "WERKSTOFF"); v(c2 + 2, y + 13, c.werkstoff || "—");
  k(c2 + 2, y + 21, "MASSSTAB"); v(c2 + 2, y + 28, this.massstabLabel);
  // Rechte Spalte: Zeichnungsnr / Datum / Projektionssymbol (je 10 mm Zeile)
  e.push('<line x1="' + c3 + '" y1="' + (y + 10) + '" x2="' + (x + w) + '" y2="' + (y + 10) + '" class="az-sf"/>');
  e.push('<line x1="' + c3 + '" y1="' + (y + 20) + '" x2="' + (x + w) + '" y2="' + (y + 20) + '" class="az-sf"/>');
  k(c3 + 2, y + 4, "ZEICHN.-NR"); v(c3 + 2, y + 8.6, c.nummer || "—");
  k(c3 + 2, y + 14, "DATUM"); v(c3 + 2, y + 18.6, c.datum || "__.__.____");
  // Projektionssymbol (1. Winkel), zentriert in der unteren rechten Zelle
  this._projektion(c3 + 5, y + 25, e);
  return e.join("");
};

AZ.Blatt.prototype._projektion = function (px, py, e) {
  // vereinfachtes Symbol Projektionsmethode 1 (europäisch)
  e.push('<g transform="translate(' + px + ',' + py + ')">' +
    '<path d="M0,-4 L8,-2 L8,2 L0,4 Z" class="az-thin" fill="none"/>' +
    '<circle cx="18" cy="0" r="2.4" class="az-thin" fill="none"/>' +
    '<circle cx="18" cy="0" r="4" class="az-thin" fill="none"/>' +
    '<line x1="8" y1="0" x2="14" y2="0" class="az-thin"/>' +
    '</g>');
};

AZ.Blatt.prototype.svg = function () {
  var vb = "0 0 " + this.W + " " + this.H;
  var frameX = this.mL, frameY = this.mT,
    frameW = this.W - this.mL - this.mR, frameH = this.H - this.mT - this.mB;
  var out = '<svg class="az-blatt" viewBox="' + vb + '" role="img" ' +
    'aria-label="' + AZ.esc(this.cfg.titel || "Technische Zeichnung") + '" ' +
    'preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  out += AZ._defs(this.uid);
  out += AZ._style();
  // Blattfläche + Rahmen
  out += '<rect x="0" y="0" width="' + this.W + '" height="' + this.H + '" fill="#fdfdfb"/>';
  out += '<rect x="' + frameX + '" y="' + frameY + '" width="' + frameW + '" height="' + frameH + '" class="az-frame"/>';
  // Zeichnungsinhalt
  out += '<g marker-mid="">' + this.body.join("") + '</g>';
  // Schriftfeld
  out += this._schriftfeld();
  out += "</svg>";
  return out;
};

/* ----------------------------------------------------------------------------
   AZ.Pen — zeichnet in Welt-mm, transformiert in Blatt-mm (Skalierung s)
   ---------------------------------------------------------------------------*/
AZ.Pen = function (blatt, s, ox, oy) {
  this.b = blatt; this.s = s; this.ox = ox; this.oy = oy;
};
AZ.Pen.prototype.X = function (x) { return +(this.ox + x * this.s).toFixed(3); };
AZ.Pen.prototype.Y = function (y) { return +(this.oy + y * this.s).toFixed(3); };
AZ.Pen.prototype._p = function (svg) { this.b.push(svg); };

AZ.Pen.prototype.rect = function (x, y, w, h, cls) {
  cls = cls || "az-vis";
  this._p('<rect x="' + this.X(x) + '" y="' + this.Y(y) + '" width="' + (w * this.s).toFixed(3) +
    '" height="' + (h * this.s).toFixed(3) + '" class="' + cls + '" fill="none"/>');
};
AZ.Pen.prototype.line = function (x1, y1, x2, y2, cls) {
  cls = cls || "az-vis";
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(y1) + '" x2="' + this.X(x2) + '" y2="' + this.Y(y2) + '" class="' + cls + '"/>');
};
AZ.Pen.prototype.circle = function (cx, cy, r, cls) {
  cls = cls || "az-vis";
  this._p('<circle cx="' + this.X(cx) + '" cy="' + this.Y(cy) + '" r="' + (r * this.s).toFixed(3) + '" class="' + cls + '" fill="none"/>');
};
AZ.Pen.prototype.center = function (x1, y1, x2, y2) { this.line(x1, y1, x2, y2, "az-center"); };
AZ.Pen.prototype.hidden = function (x1, y1, x2, y2) { this.line(x1, y1, x2, y2, "az-hidden"); };
AZ.Pen.prototype.fill = function (x, y, w, h) {
  this._p('<rect x="' + this.X(x) + '" y="' + this.Y(y) + '" width="' + (w * this.s).toFixed(3) +
    '" height="' + (h * this.s).toFixed(3) + '" class="az-part"/>');
};
AZ.Pen.prototype.text = function (x, y, t, cls) {
  cls = cls || "az-dimtx";
  this._p('<text x="' + this.X(x) + '" y="' + this.Y(y) + '" class="' + cls + '">' + AZ.esc(t) + '</text>');
};

/* Bemaßung: Maßhilfslinien (schmal, Überstand), Maßlinie mit Pfeilen, Maßzahl
   dimH(x1,x2, yMass, yKante, opts) — horizontal, Maß = |x2-x1| mm             */
AZ.Pen.prototype.dimH = function (x1, x2, yMass, yKante, opts) {
  opts = opts || {};
  var uid = this.b.uid, over = 1.5; // Überstand Maßhilfslinie mm
  var dir = (yMass < yKante) ? -1 : 1;
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(yKante) + '" x2="' + this.X(x1) + '" y2="' + this.Y(yMass + dir * over) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(x2) + '" y1="' + this.Y(yKante) + '" x2="' + this.X(x2) + '" y2="' + this.Y(yMass + dir * over) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(x1) + '" y1="' + this.Y(yMass) + '" x2="' + this.X(x2) + '" y2="' + this.Y(yMass) +
    '" class="az-thin" marker-start="url(#' + uid + 'as)" marker-end="url(#' + uid + 'ae)"/>');
  var t = (opts.text != null) ? opts.text : String(Math.round(Math.abs(x2 - x1)));
  var mx = (x1 + x2) / 2, ty = yMass + dir * 1.4;
  this._p('<text x="' + this.X(mx) + '" y="' + this.Y(ty) + '" class="' + (opts.cls || 'az-dimtx') + '" text-anchor="middle">' + AZ.esc(t) + '</text>');
};
AZ.Pen.prototype.dimV = function (y1, y2, xMass, xKante, opts) {
  opts = opts || {};
  var uid = this.b.uid, over = 1.5;
  var dir = (xMass < xKante) ? -1 : 1;
  this._p('<line x1="' + this.X(xKante) + '" y1="' + this.Y(y1) + '" x2="' + this.X(xMass + dir * over) + '" y2="' + this.Y(y1) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(xKante) + '" y1="' + this.Y(y2) + '" x2="' + this.X(xMass + dir * over) + '" y2="' + this.Y(y2) + '" class="az-thin"/>');
  this._p('<line x1="' + this.X(xMass) + '" y1="' + this.Y(y1) + '" x2="' + this.X(xMass) + '" y2="' + this.Y(y2) +
    '" class="az-thin" marker-start="url(#' + uid + 'as)" marker-end="url(#' + uid + 'ae)"/>');
  var t = (opts.text != null) ? opts.text : String(Math.round(Math.abs(y2 - y1)));
  var my = (y1 + y2) / 2, tx = this.X(xMass + dir * 1.6), tyy = this.Y(my);
  this._p('<text x="' + tx + '" y="' + tyy + '" class="' + (opts.cls || 'az-dimtx') + '" text-anchor="middle" transform="rotate(-90 ' + tx + ' ' + tyy + ')">' + AZ.esc(t) + '</text>');
};
/* Durchmesser-Bemaßung als Hinweislinie: ⌀d  */
AZ.Pen.prototype.dimDia = function (cx, cy, r, angDeg, d, opts) {
  opts = opts || {};
  var a = angDeg * Math.PI / 180;
  var x1 = cx + r * Math.cos(a), y1 = cy + r * Math.sin(a);
  var x2 = cx + (r + 8) * Math.cos(a), y2 = cy + (r + 8) * Math.sin(a);
  this.line(x1, y1, x2, y2, "az-thin");
  var t = (opts.text != null) ? opts.text : ("⌀" + d);
  this._p('<text x="' + this.X(x2 + 1) + '" y="' + this.Y(y2) + '" class="' + (opts.cls || 'az-dimtx') + '">' + AZ.esc(t) + '</text>');
};

/* Innengewinde in Vorderansicht (DIN ISO 6410):
   Kernloch = breiter Vollkreis, Gewinde-Nenn-⌀ = schmaler 3/4-Kreis */
AZ.Pen.prototype.gewindeFront = function (cx, cy, dNom, core) {
  this.circle(cx, cy, core / 2, "az-vis");           // Kernloch (breit)
  var r = (dNom / 2) * this.s, X = this.X(cx), Y = this.Y(cy);
  var a0 = Math.PI * 0.13, a1 = Math.PI * 1.87;      // Lücke oben rechts
  var x0 = (X + r * Math.cos(a0)).toFixed(2), y0 = (Y + r * Math.sin(a0)).toFixed(2);
  var x1 = (X + r * Math.cos(a1)).toFixed(2), y1 = (Y + r * Math.sin(a1)).toFixed(2);
  this._p('<path d="M' + x0 + ',' + y0 + ' A' + r.toFixed(2) + ',' + r.toFixed(2) +
    ' 0 1 1 ' + x1 + ',' + y1 + '" class="az-thin" fill="none"/>');
};

/* Schnittschraffur (45°, schmal) innerhalb einer Polygon-Kontur, abzügl. Löcher.
   points/holes: Arrays von [x,y] in Welt-mm (Löcher = Polygon-Arrays) */
AZ.Pen.prototype.hatchPoly = function (points, holes, spacing) {
  spacing = spacing || 2.4;
  var self = this, uid = this.b.uid + "h" + (this.b._hc = (this.b._hc || 0) + 1);
  function poly(pts) {
    return "M" + pts.map(function (p) { return self.X(p[0]) + "," + self.Y(p[1]); }).join(" L") + " Z";
  }
  var d = poly(points);
  (holes || []).forEach(function (ho) { d += " " + poly(ho); });
  this._p('<clipPath id="' + uid + '"><path d="' + d + '" clip-rule="evenodd"/></clipPath>');
  var xs = points.map(function (p) { return p[0]; }), ys = points.map(function (p) { return p[1]; });
  var minx = Math.min.apply(0, xs), maxx = Math.max.apply(0, xs), miny = Math.min.apply(0, ys), maxy = Math.max.apply(0, ys);
  var X0 = this.X(minx), Y0 = this.Y(miny), W = (maxx - minx) * this.s, H = (maxy - miny) * this.s;
  var step = spacing * this.s, lines = "";

  });

}

      render: function () {

          '<div class="zeichnung-halter">' + azHalteplatte("fertig") + '</div>' +
          '<p class="chk-hint">Reale Maße 90 × 50 × 15 mm · Bohrung ⌀12 H9 (+0,043/0) · Gewinde M8 · Fase 2×45° · Ra 3,2 · Allgemeintoleranz ISO 2768-m · S235JR.</p>';

          '<div class="zeichnung-halter">' + azHalteplatte("ergaenzen") + '</div>' +
          '<p class="chk-hint">Aufgabe: fehlende <strong>Maße</strong> eintragen, <strong>Gewinde M8</strong> und <strong>Schnitt A–A</strong> ergänzen, ' +

      },

    {
      id: "gm-praxis", typ: "praxis", titel: "Praxis-Arbeitsauftrag: fertigen & prüfen", blattNr: "GM-P01",
      render: function () {
        return '' +
          '<div class="bl-meta"><span>Praxis</span><span>Werkbank</span><span>Abnahme: Ausbilder</span></div>' +
          '<h3>Arbeitsschritte</h3>' +
          '<div class="chk"><span class="box"></span>PSA anlegen, Arbeitsplatz &amp; Werkzeug vorbereiten</div>' +
          '<div class="chk"><span class="box"></span>Rohteil nach Zeichnung anreißen und körnen (Lochmitten 25 / 65)</div>' +
          '<div class="chk"><span class="box"></span>Außenmaße 90 × 50 auf Endmaß feilen, Dicke 15 prüfen</div>' +
          '<div class="chk"><span class="box"></span>Kernloch ⌀6,8 bohren, Gewinde M8 schneiden (Schneideisen/Bohrer)</div>' +

          '<li><strong>F3:</strong> n = (35 · 1000) / (π · 12) = 35000 / 37,70 ≈ <strong>928 min<sup>-1</sup></strong>.</li>' +
          '<li><strong>F4:</strong> M8 → Kernloch-⌀ <strong>6,8 mm</strong> (DIN 13).</li>' +
          '<li><strong>F5:</strong> ⌀12 H9 → oberes Abmaß <strong>+0,043 mm</strong>, unteres <strong>0 mm</strong> (Istmaß 12,000…12,043).</li>' +

/* ============================================================================
   Azubi Cockpit — App (Hash-Router + Views)
   ==========================================================================*/
(function () {
  "use strict";
  var C = window.AZ_CURRICULUM;
  var CONTENT = window.AZ_CONTENT || {};
  var app = document.getElementById("app");

  /* ---------- Helpers ---------- */
  function h(html) { return html; }
  function findLj(n) { return C.lehrjahre.filter(function (l) { return l.nr == n; })[0]; }
  function findModul(id) {
    for (var i = 0; i < C.lehrjahre.length; i++) {
      var m = C.lehrjahre[i].module.filter(function (x) { return x.id === id; })[0];
      if (m) return { modul: m, lj: C.lehrjahre[i] };
    }
    return null;
  }
  function ljProgress(lj) {
    var total = lj.module.length;
    var done = lj.module.filter(function (m) { return m.status === "fertig"; }).length;
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
  }
  function lfById(nr) { return C.lernfelder.filter(function (x) { return x.nr == nr; })[0]; }

  function setNav(active) {
    document.querySelectorAll(".nav a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-k") === active);
    });
  }

  /* ---------- View: Start ---------- */
  function viewStart() {
    setNav("start");
    var flow = C.prinzip.map(function (p, i) {
      var desc = ["Auftrag, Lernziel und Bezug zum Rahmenplan.",
        "Arbeitsblätter, Zeichnungen &amp; Pläne — druckfertig, mit Lösung.",
        "Auftrag an Werkbank/Anlage mit Prüfkriterien und Abnahme."][i];
      return '<div class="step"><div class="num">SCHRITT 0' + (i + 1) + '</div><h3>' + p + '</h3><p>' + desc + '</p></div>';
    }).join("");

    var ljCards = C.lehrjahre.map(function (lj) {
      var pr = ljProgress(lj);
      return '<a class="lj-card" href="#/lj/' + lj.nr + '">' +
        '<span class="lj">' + lj.titel.toUpperCase() + '</span>' +
        '<h3>' + lj.untertitel + '</h3>' +
        '<p>' + lj.module.length + ' Module · Lernfelder ' + lj.lernfelder.join(", ") + '</p>' +
        '<div class="progress"><i style="width:' + pr.pct + '%"></i></div>' +
        '<div class="pmeta"><span>' + pr.done + '/' + pr.total + ' Module fertig</span><span>' + (lj.pruefung || "") + '</span></div>' +
        '</a>';
    }).join("");

    app.innerHTML = h(
      '<div class="wrap">' +
      '<p class="eyebrow">Ausbildung ' + C.beruf + ' · ' + C.dauer + '</p>' +
      '<h1>Azubi Cockpit</h1>' +
      '<p class="lead">Dein Hauptquartier für die Ausbildung: strukturiert nach <strong>Ausbildungsrahmenplan (Betrieb)</strong> und <strong>Lernfeldern (Berufsschule)</strong>. Druckfertige Arbeitsblätter, echte technische Zeichnungen &amp; Pläne — jeweils mit Lösungsheft.</p>' +

      '<section><p class="eyebrow">Das Prinzip</p><h2>Jede Aufgabe in drei Schritten</h2>' +
      '<div class="flow">' + flow + '</div></section>' +

      '<section><p class="eyebrow">Duale Ausbildung</p><h2>Zwei Lernorte, ein Plan</h2>' +
      '<div class="duale">' +
      '<div class="card"><small>Betrieb</small><h3>Ausbildungsrahmenplan</h3><p>Sachliche &amp; zeitliche Gliederung nach MechatronikerAusbV — mit Zeitrichtwerten in Wochen.</p></div>' +
      '<div class="card"><small>Berufsschule</small><h3>13 Lernfelder (KMK)</h3><p>Kompetenzorientierter Rahmenlehrplan — jedes Modul ist einem Lernfeld zugeordnet.</p></div>' +
      '</div></section>' +

      '<section><p class="eyebrow">Der Fahrplan</p><h2>Vom 1. bis zum 3. Lehrjahr</h2>' +
      '<div class="lj-grid">' + ljCards + '</div></section>' +

      '<div class="footer">AZUBI COCKPIT · ' + C.beruf + ' · strukturiert nach Rahmenplan &amp; Lernfeldern · kein erfundener Inhalt</div>' +
      '</div>'
    );
  }

  /* ---------- View: Lehrjahr ---------- */
  function viewLj(n) {
    var lj = findLj(n);
    if (!lj) return viewStart();
    setNav("lj" + n);

    var lfRows = lj.lernfelder.map(function (nr) {
      var lf = lfById(nr);
      return '<div class="lf-item"><span class="n">LF ' + lf.nr + '</span><span>' + lf.titel + '</span>' +
        '<span class="h">' + (lf.stunden ? lf.stunden + " h" : "lt. KMK") + '</span></div>';
    }).join("");

    var rows = lj.module.map(function (m) {
      var fertig = m.status === "fertig";
      var href = fertig ? '#/modul/' + m.id : '#/modul/' + m.id;
      return '<a class="mod-row' + (fertig ? "" : " locked") + '" href="' + href + '">' +
        '<span class="badge ' + m.status + '">' + (fertig ? "fertig" : "Gerüst") + '</span>' +
        '<div><div class="fach">' + m.fach + '</div><h3>' + m.titel + '</h3><div class="sub">' + m.beschreibung + '</div></div>' +
        '<div class="weeks">' + m.wochen + '</div></a>';
    }).join("");

    app.innerHTML = h(
      '<div class="wrap">' +
      '<div class="crumb"><a href="#/">Cockpit</a> / ' + lj.titel + '</div>' +
      '<p class="eyebrow">' + lj.titel + (lj.pruefung ? " · " + lj.pruefung : "") + '</p>' +
      '<h1>' + lj.untertitel + '</h1>' +
      '<div class="lf-box"><h3>Berufsschule — Lernfelder in diesem Lehrjahr</h3>' + lfRows + '</div>' +
      '<section style="margin-top:26px"><h2>Module (Betrieb)</h2><div class="mod-list">' + rows + '</div></section>' +
      '<div class="footer">Zeitrichtwerte nach Ausbildungsrahmenplan · an betrieblichen Plan anpassbar</div>' +
      '</div>'
    );
  }

  /* ---------- View: Modul ---------- */
  function viewModul(id) {
    var f = findModul(id);
    if (!f) return viewStart();
    var m = f.modul, lj = f.lj;
    setNav("lj" + lj.nr);
    var content = CONTENT[id];

    var normen = (m.normen || []).map(function (n) { return '<span class="chip">' + n + '</span>'; }).join("");
    var lfChips = lj.lernfelder.map(function (nr) { return '<span class="chip">LF ' + nr + '</span>'; }).join("");

    var body;
    if (content && content.bausteine) {
      var cards = content.bausteine.map(function (bs) {
        return '<a class="bs" href="#/modul/' + id + '/' + bs.id + '">' +
          '<span class="typ ' + bs.typ + '">' + bs.typ + '</span>' +
          '<div class="t"><h3>' + bs.titel + '</h3><small>' + (bs.blattNr || "") + '</small></div>' +
          '<span class="mono" style="color:var(--ink-3)">→</span></a>';
      }).join("");
      body = '<p class="lead">' + content.intro + '</p>' +
        '<section style="margin-top:22px"><h2>Blätter</h2><div class="baustein-grid">' + cards + '</div></section>';
    } else {
      body = '<div class="lf-box" style="border-left-color:var(--warn)"><h3>In Vorbereitung</h3>' +
        '<p>Dieses Modul ist im Gerüst angelegt. Struktur, Rahmenplan-Bezug und Lernfeld stehen — die Arbeitsblätter, Zeichnungen und Lösungen folgen im gleichen Qualitätsstandard (normgerecht, kein erfundener Inhalt).</p></div>';
    }

    app.innerHTML = h(
      '<div class="wrap">' +
      '<div class="crumb"><a href="#/">Cockpit</a> / <a href="#/lj/' + lj.nr + '">' + lj.titel + '</a> / ' + m.titel + '</div>' +
      '<p class="eyebrow">' + m.fach + ' · ' + m.status + '</p>' +
      '<h1>' + m.titel + '</h1>' +
      '<div class="mod-meta"><span class="chip"><b>Wochen:</b> ' + m.wochen + '</span>' +
      '<span class="chip"><b>Rahmenplan:</b> ' + m.rahmenplan + '</span>' + lfChips + normen + '</div>' +
      body +
      '<div class="footer">Modul-ID ' + m.id + '</div>' +
      '</div>'
    );
  }

  /* ---------- View: Blatt (Detail) ---------- */
  function viewBlatt(id, bsId) {
    var f = findModul(id);
    var content = CONTENT[id];
    if (!f || !content) return viewModul(id);
    var m = f.modul, lj = f.lj;
    var idx = -1, bs = null;
    content.bausteine.forEach(function (b, i) { if (b.id === bsId) { bs = b; idx = i; } });
    if (!bs) return viewModul(id);
    setNav("lj" + lj.nr);

    var prev = idx > 0 ? content.bausteine[idx - 1] : null;
    var next = idx < content.bausteine.length - 1 ? content.bausteine[idx + 1] : null;
    var pager =
      (prev ? '<a class="btn" href="#/modul/' + id + '/' + prev.id + '">← ' + prev.titel + '</a>' : '<span></span>') +
      (next ? '<a class="btn" href="#/modul/' + id + '/' + next.id + '">' + next.titel + ' →</a>' : '<span></span>');

    app.innerHTML = h(
      '<div class="wrap">' +
      '<div class="crumb"><a href="#/">Cockpit</a> / <a href="#/lj/' + lj.nr + '">' + lj.titel + '</a> / <a href="#/modul/' + id + '">' + m.titel + '</a> / ' + bs.blattNr + '</div>' +
      '<div class="blatt-print">' +
      '<div class="blatt-head"><span class="no">' + (bs.blattNr || "") + '</span><h2>' + bs.titel + '</h2><span class="app-tag">Azubi Cockpit</span></div>' +
      bs.render() +
      '</div>' +
      '<div class="btnrow"><button class="btn primary" id="btnPrint">🖨 Dieses Blatt drucken (PDF)</button>' +
      '<a class="btn" href="#/modul/' + id + '">Zurück zum Modul</a></div>' +
      '<div class="pager">' + pager + '</div>' +
      '<div class="footer">' + m.titel + ' · ' + bs.blattNr + '</div>' +
      '</div>'
    );
    var pb = document.getElementById("btnPrint");
    if (pb) pb.addEventListener("click", function () {
      document.body.classList.add("print-blatt");
      window.print();
      setTimeout(function () { document.body.classList.remove("print-blatt"); }, 300);
    });
  }

  /* ---------- Router ---------- */
  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    window.scrollTo(0, 0);
    if (parts.length === 0) return viewStart();
    if (parts[0] === "lj") return viewLj(parts[1]);
    if (parts[0] === "modul" && parts.length >= 3) return viewBlatt(parts[1], parts[2]);
    if (parts[0] === "modul") return viewModul(parts[1]);
    return viewStart();
  }

  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);
  if (document.readyState !== "loading") route();
})();


(function(){var t=document.getElementById('themeToggle');if(!t)return;t.addEventListener('click',function(e){e.preventDefault();var r=document.documentElement;var c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':'dark');});})();
</script>
</body>
